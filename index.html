<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="德扑GTO">
<meta name="theme-color" content="#0e1318">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<script src="firebase-app-compat.js"></script>
<script src="firebase-auth-compat.js"></script>
<script src="firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<title>德扑 GTO 训练台</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@700;900&display=swap">
<style>
/* Layout: header strip; table + action bar on the left (primary), advice + log column on the right; stacks to one column on phones.
   Colour code follows solver convention: fold = blue, check/call = green, bet/raise = red. */
:root{
  color-scheme:dark;
  --bg:#0e1318; --panel:#151c22; --panel2:#1c252d; --line:#2a353e; --fg:#e8ecea; --muted:#93a0a8; --dim:#62707a;
  --felt:#16513f; --felt2:#0b2e25; --rail:#3b2b21; --rail2:#21170f; --brass:#d6ab52; --brass-soft:rgba(214,171,82,.18);
  --fold:#4d84d6; --call:#35a776; --raise:#de5847;
  --cardbg:#f7f4ec; --cardline:#d9d3c6; --s:#1d2126; --h:#cc3430; --d:#2a6fd0; --c:#1f8a4c;
  --ff-body:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --ff-disp:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  --ff-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--ff-body);font-size:14px;line-height:1.55}
*{box-sizing:border-box}
[hidden]{display:none!important}
button,select,input{font:inherit;color:inherit}
.wrap{max-width:1320px;margin:0 auto;padding-block:16px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 24px;justify-content:space-between}
.brand h1{font-family:var(--ff-disp);font-weight:900;font-size:26px;margin:0;letter-spacing:.04em;line-height:1.2}
.brand h1 em{font-style:normal;color:var(--brass)}
.brand p{margin:2px 0 0;color:var(--muted);font-size:13px}
.stats{display:flex;gap:18px;flex-wrap:wrap}
.stat{display:flex;flex-direction:column}
.stat span{font-size:11px;color:var(--muted);letter-spacing:.06em}
.stat b{font-family:var(--ff-num);font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.pos{color:var(--call)} .neg{color:var(--raise)}
.settings{display:flex;flex-wrap:wrap;gap:10px}
.settings label{display:flex;flex-direction:column;font-size:11px;color:var(--muted);gap:3px;letter-spacing:.04em}
.settings select{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-size:13px;color:var(--fg)}
.settings select:focus-visible{outline:2px solid var(--brass);outline-offset:1px}

.main{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);grid-template-rows:auto auto 1fr;grid-template-areas:"table advice" "action advice" "log advice";gap:14px 16px;align-items:start}
#table{grid-area:table}#actionbar{grid-area:action}#advice{grid-area:advice}.logp{grid-area:log}
@media (max-width:940px){.main{grid-template-columns:minmax(0,1fr);grid-template-rows:none;grid-template-areas:"table" "action" "advice" "log"}}

/* table */
.tablebox{position:relative;width:100%;aspect-ratio:16/10.4;max-width:100%}
@media (max-width:600px){.tablebox{aspect-ratio:4/5.2}}
.felt{position:absolute;left:8%;right:8%;top:11%;bottom:12%;border-radius:50%;
  background:radial-gradient(ellipse at 50% 42%,var(--felt) 0%,var(--felt2) 78%);
  border:12px solid var(--rail);box-shadow:inset 0 0 0 2px rgba(0,0,0,.35),inset 0 10px 40px rgba(0,0,0,.45),0 0 0 2px var(--rail2),0 18px 40px rgba(0,0,0,.45)}
@media (max-width:600px){.felt{left:7%;right:7%;top:12%;bottom:13%;border-width:9px;border-radius:46%}}
.felt::after{content:"";position:absolute;inset:9%;border-radius:50%;border:1px solid rgba(214,171,82,.16);pointer-events:none}
.center{position:absolute;left:50%;top:47%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:8px;z-index:1}
.board{display:flex;gap:5px}
.slot{width:44px;height:62px;border-radius:6px;border:1px dashed rgba(255,255,255,.14)}
.potline{font-size:13px;color:#d9e6df;background:rgba(0,0,0,.32);padding:2px 12px;border-radius:999px;white-space:nowrap}
.potline b{font-family:var(--ff-num);color:var(--brass);font-weight:600}
.street{font-size:11px;letter-spacing:.12em;color:rgba(232,236,234,.55)}

.seat{position:absolute;transform:translate(-50%,-50%);width:108px;display:flex;flex-direction:column;align-items:center;gap:3px;z-index:2;transition:opacity .2s}
.seat.me{width:130px}
.seat .hole{display:flex;gap:3px;min-height:31px;align-items:flex-end}
.plate{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:2px 8px;width:100%;display:flex;justify-content:space-between;align-items:baseline;gap:6px;font-size:12px;white-space:nowrap}
.plate .nm{overflow:hidden;text-overflow:ellipsis}
.plate .ps{font-family:var(--ff-num);font-size:11px;color:var(--brass);font-weight:600}
.stk{font-family:var(--ff-num);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;line-height:1.2}
.tag{font-size:11px;line-height:1.5;padding:0 8px;border-radius:999px;background:rgba(0,0,0,.45);color:var(--fg);white-space:nowrap;max-width:140px;overflow:hidden;text-overflow:ellipsis}
.tag.t-fold{color:#9dbbe8}.tag.t-call{color:#8fdcb6}.tag.t-raise{color:#f5a196}.tag.t-win{background:var(--call);color:#06150e;font-weight:700}
.seat.me .plate{background:#24313b;border-color:#3a4955}
.seat.turn .plate{border-color:var(--brass);box-shadow:0 0 0 3px var(--brass-soft)}
.seat.out{opacity:.42}
.seat.win .plate{border-color:var(--call)}
@media (max-width:600px){
  .seat{width:78px}.seat.me{width:112px}
  .plate{padding:1px 5px;font-size:11px}.plate .ps{font-size:10px}
  .stk{font-size:11px}.tag{font-size:10px;padding:0 6px;max-width:92px}
  .slot{width:34px;height:48px}
  .board{gap:4px}
}
.chip{position:absolute;transform:translate(-50%,-50%);font-family:var(--ff-num);font-size:12px;font-weight:600;color:#1a1408;background:var(--brass);padding:0 7px;border-radius:999px;box-shadow:0 2px 0 rgba(0,0,0,.35);z-index:1;white-space:nowrap}
.dealer{position:absolute;transform:translate(-50%,-50%);width:22px;height:22px;border-radius:50%;background:#f1ece0;color:#1b1b1b;font-weight:700;font-size:12px;display:grid;place-items:center;box-shadow:0 2px 0 rgba(0,0,0,.4);z-index:1}

/* cards */
.card{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;background:var(--cardbg);border:1px solid var(--cardline);border-radius:6px;font-family:var(--ff-num);font-weight:600;line-height:1;box-shadow:0 2px 3px rgba(0,0,0,.35);flex:none}
.card b{font-weight:600}.card i{font-style:normal}
.card.md{width:44px;height:62px;font-size:19px;gap:3px}.card.md i{font-size:18px}
.card.lg{width:44px;height:62px;font-size:19px;gap:3px}.card.lg i{font-size:18px}
.card.sm{width:23px;height:32px;font-size:11px;border-radius:4px;gap:1px}.card.sm i{font-size:10px}
.card.xs{width:20px;height:27px;font-size:10px;border-radius:3px;gap:0;vertical-align:middle;box-shadow:none}.card.xs i{font-size:9px}
.card.s-s{color:var(--s)}.card.s-h{color:var(--h)}.card.s-d{color:var(--d)}.card.s-c{color:var(--c)}
.card.back{background:repeating-linear-gradient(45deg,#7d2a26 0 4px,#93352f 4px 8px);border:2px solid #f1ece0}
@media (max-width:600px){.card.md,.card.lg{width:34px;height:48px;font-size:15px}.card.md i,.card.lg i{font-size:14px}.card.sm{width:18px;height:26px;font-size:9px}.card.sm i{font-size:8px}}

/* action bar */
.actionbar{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;min-height:64px}
.info{display:flex;flex-wrap:wrap;gap:4px 16px;color:var(--muted);font-size:13px}
.info b{font-family:var(--ff-num);color:var(--fg);font-weight:600}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:0;border-radius:9px;padding:9px 16px;font-weight:700;font-size:15px;cursor:pointer;min-width:84px;transition:transform .06s,filter .15s}
.btn:hover{filter:brightness(1.1)}.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.btn.fold{background:var(--fold);color:#fff}.btn.call{background:var(--call);color:#04140c}.btn.raise{background:var(--raise);color:#fff}
.btn.primary{background:var(--brass);color:#1a1408}.btn.ghost{background:var(--panel2);border:1px solid var(--line);color:var(--fg);font-weight:500}
.sizer{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.pre{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:3px 11px;font-size:12px;cursor:pointer;color:var(--fg)}
.pre.on{border-color:var(--raise);color:#f5a196}
.pre.rec{box-shadow:inset 0 0 0 1px var(--brass)}
.sizer input[type=range]{flex:1 1 140px;min-width:0;accent-color:var(--raise)}
.sizer input[type=number]{width:78px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:4px 6px;font-family:var(--ff-num)}
.wait{color:var(--muted)}
.verdict{display:flex;gap:8px;align-items:flex-start;font-size:13px;line-height:1.45;padding:6px 10px;border-radius:8px;background:var(--panel2);border-left:3px solid var(--dim)}
.verdict .vi{font-weight:700;font-size:16px;line-height:1.25;flex:none}
.verdict b{font-weight:700}
.verdict.lv-best{border-left-color:var(--call)}.verdict.lv-best .vi{color:var(--call)}
.verdict.lv-ok{border-left-color:var(--brass)}.verdict.lv-ok .vi{color:var(--brass)}
.verdict.lv-meh{border-left-color:#e08a3a}.verdict.lv-meh .vi{color:#e08a3a}
.verdict.lv-bad{border-left-color:var(--raise)}.verdict.lv-bad .vi{color:var(--raise)}
.mini{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.mini .fbar{height:8px}
.hs{font-size:13px;color:var(--muted)}
.warnbox{background:rgba(224,138,58,.12);border:1px solid rgba(224,138,58,.45);color:#f0c49a;border-radius:9px;padding:8px 10px;font-size:13px}
.verdict.lv-na{border-left-color:var(--dim)}.verdict.lv-na .vi{color:var(--muted)}
.fb.lv-na{border-left-color:var(--dim)}.fb.lv-na .badge{color:var(--muted)}
.rv.lv-na{color:var(--muted)}
.optbtn{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:13px;color:var(--fg);cursor:pointer;text-align:left;max-width:15em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.optbtn:focus-visible{outline:2px solid var(--brass);outline-offset:1px}
.sty{display:inline-block;font-family:var(--ff-body);font-size:10px;line-height:1.5;padding:0 5px;border-radius:4px;font-weight:700;vertical-align:1px}
.sty-gto{background:rgba(147,160,168,.18);color:#c3ccd1}.sty-tag{background:rgba(77,132,214,.22);color:#9dbbe8}.sty-lag{background:rgba(222,88,71,.22);color:#f5a196}
.sty-nit{background:rgba(140,111,214,.24);color:#c3b2f0}.sty-lp{background:rgba(53,167,118,.2);color:#8fdcb6}.sty-fish{background:rgba(214,171,82,.22);color:#e6c47c}
.sizebox,.hint{background:var(--panel2);border-radius:9px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.hint{border-left:3px solid var(--brass)}
.sbt{font-weight:700;font-size:13.5px}
.sizebox p,.hint p{margin:0;font-size:13px;color:#d6ddd9}
.hint span{font-size:11.5px;color:var(--dim)}
.szwrap{overflow-x:auto}
table.sz{width:100%;border-collapse:collapse;font-size:12.5px;min-width:340px}
table.sz th{text-align:left;color:var(--muted);font-weight:500;padding:4px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
table.sz td{padding:5px 6px;border-bottom:1px solid var(--line)}
table.sz td:nth-child(2),table.sz td:nth-child(3){font-family:var(--ff-num);font-variant-numeric:tabular-nums;white-space:nowrap}
table.sz td:first-child{white-space:nowrap}
table.sz tr.rec td{color:var(--fg);font-weight:700;background:rgba(214,171,82,.1)}
table.sz tr.rec td:last-child{color:var(--brass)}
p.szn{font-size:11.5px;color:var(--dim)}
.sheet.wide{max-width:520px}
.presets{gap:6px}
.opplist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (max-width:460px){.opplist{grid-template-columns:minmax(0,1fr)}}
.opplist label{flex-direction:row!important;align-items:center;justify-content:space-between;gap:8px;background:var(--panel2);border-radius:8px;padding:6px 8px;color:var(--fg)!important}
.opplist select{background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:4px 6px;font-size:13px;color:var(--fg);min-width:0}
.styd{margin:0;display:flex;flex-direction:column;gap:5px;font-size:12.5px}
.styd div{display:grid;grid-template-columns:3.6em 1fr;gap:6px;align-items:baseline}
.styd dd{margin:0;color:var(--muted)}
.acct{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:6px 14px 6px 12px;cursor:pointer;max-width:100%}
.acct span{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:12em}
.acct small{color:var(--muted);font-size:12px;white-space:nowrap}
.acct:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block;background:var(--dim)}
.dot.ok{background:var(--call)}.dot.busy{background:var(--brass)}.dot.off{background:#e08a3a}.dot.none{background:var(--dim)}
.modal{position:fixed;inset:0;background:rgba(5,8,10,.66);z-index:50;display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow-y:auto}
.sheet{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;width:100%;max-width:400px;display:flex;flex-direction:column;gap:12px;margin:auto}
.sheet h2{margin:0;font-family:var(--ff-disp);font-size:20px}
.sheet .x{position:absolute;top:8px;right:10px;background:none;border:0;font-size:24px;color:var(--muted);cursor:pointer;line-height:1;padding:4px 8px}
.sheet form{display:flex;flex-direction:column;gap:10px}
.sheet label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.sheet input{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:16px;color:var(--fg)}
.sheet input:focus-visible{outline:2px solid var(--brass);outline-offset:1px}
.sheet .tabs{display:flex;gap:4px;background:var(--panel2);border-radius:9px;padding:3px}
.sheet .tabs button{flex:1;border:0;background:none;padding:7px;border-radius:7px;cursor:pointer;color:var(--muted)}
.sheet .tabs button.on{background:var(--bg);color:var(--fg);font-weight:700}
.sheet .row{display:flex;gap:8px;flex-wrap:wrap}
.sheet .links{justify-content:center}
.lnk{background:none;border:0;color:var(--brass);cursor:pointer;padding:2px 4px;font-size:13px}
.btn.sm{padding:7px 14px;font-size:14px;min-width:0;text-decoration:none;display:inline-block}
.btn[disabled]{opacity:.6;cursor:default}
.err{color:#f5a196;margin:0;font-size:13px}.ok{color:#8fdcb6;margin:0;font-size:13px}.warn{color:#e8b07a;margin:0;font-size:13px}
.fine{color:var(--dim);font-size:12px;margin:0}
.who{display:flex;flex-direction:column}.who span{color:var(--muted);font-size:13px}
.syncrow{display:flex;gap:10px;align-items:flex-start;background:var(--panel2);border-radius:9px;padding:10px}
.syncrow .dot{margin-top:6px}.syncrow div{display:flex;flex-direction:column}.syncrow span{color:var(--muted);font-size:13px}
.mstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.mstats div{background:var(--panel2);border-radius:8px;padding:6px 8px}.mstats span{display:block;font-size:11px;color:var(--muted)}.mstats b{font-family:var(--ff-num);font-size:16px}
.merge{border:1px solid var(--brass);border-radius:9px;padding:10px;display:flex;flex-direction:column;gap:8px}.merge p{margin:0;font-size:13px}
.res{font-size:16px}.res b{font-family:var(--ff-num);font-size:20px}

/* panels */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.panel h2{margin:0;font-size:15px;font-family:var(--ff-disp);font-weight:700;display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;letter-spacing:.03em}
.kind{font-family:var(--ff-body);font-size:11px;font-weight:500;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:0 8px;letter-spacing:.02em}
.sit{margin:0;color:#cfd8d3}
.fbar{display:flex;height:14px;border-radius:4px;overflow:hidden;background:var(--panel2)}
.fbar span{display:block;height:100%}
.f-fold{background:var(--fold)}.f-check,.f-call{background:var(--call)}.f-bet,.f-raise{background:var(--raise)}
.opts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.opts li{display:grid;grid-template-columns:12px 1fr auto;gap:8px;align-items:center;font-size:14px}
.opts li .sw{width:12px;height:12px;border-radius:3px}
.opts li b{font-family:var(--ff-num);font-weight:600;font-variant-numeric:tabular-nums}
.opts li.top span{font-weight:700}
.opts li.zero{color:var(--dim)}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
@media (max-width:420px){.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kv{background:var(--panel2);border-radius:8px;padding:6px 8px}
.kv span{display:block;font-size:11px;color:var(--muted)}
.kv b{font-family:var(--ff-num);font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
.line{font-size:13px;color:#cfd8d3}
.line .lbl{color:var(--muted)}
.why{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:13px;color:#d6ddd9}
.fb{border-radius:9px;padding:8px 10px;font-size:13px;background:var(--panel2);border-left:3px solid var(--dim)}
.fb .badge{font-weight:700;margin-right:6px}
.fb.lv-best{border-left-color:var(--call)}.fb.lv-best .badge{color:var(--call)}
.fb.lv-ok{border-left-color:var(--brass)}.fb.lv-ok .badge{color:var(--brass)}
.fb.lv-meh{border-left-color:#e08a3a}.fb.lv-meh .badge{color:#e08a3a}
.fb.lv-bad{border-left-color:var(--raise)}.fb.lv-bad .badge{color:var(--raise)}
.quiz{display:flex;flex-direction:column;gap:8px;align-items:flex-start;color:var(--muted)}
.dist{display:flex;flex-direction:column;gap:5px}
.dist .bar{display:flex;height:10px;border-radius:3px;overflow:hidden;background:var(--panel2)}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}

<script>
'use strict';
/* ================= constants ================= */
const RANK_CH='23456789TJQKA', DESC='AKQJT98765432';
const SUIT_SYM=['♠','♥','♦','♣'], SUIT_CLS=['s','h','d','c'];
const BB=10, START=100*BB;

/* ================= evaluator ================= */
const STR=new Int8Array(8192);
for(let m=0;m<8192;m++){let s=-1;for(let h=12;h>=4;h--){const need=0x1F<<(h-4);if((m&need)===need){s=h;break;}}if(s<0&&(m&0x100F)===0x100F)s=3;STR[m]=s;}
const _cnt=new Int8Array(13),_sm=new Int32Array(4),_sc=new Int8Array(4);
function kick(mask,n,shift){let v=0;for(let r=12;r>=0&&n>0;r--){if(mask>>r&1){v|=r<<shift;shift-=4;n--;}}return v;}
function evalHand(cs){
  _cnt.fill(0);_sm.fill(0);_sc.fill(0);let mask=0;
  for(let i=0;i<cs.length;i++){const c=cs[i],r=c>>2,s=c&3;_cnt[r]++;mask|=1<<r;_sm[s]|=1<<r;_sc[s]++;}
  let fs=-1;for(let s=0;s<4;s++)if(_sc[s]>=5)fs=s;
  if(fs>=0){const sh=STR[_sm[fs]];if(sh>=0)return(8<<20)|(sh<<16);}
  let q=-1,t1=-1,t2=-1,p1=-1,p2=-1;
  for(let r=12;r>=0;r--){const c=_cnt[r];if(c===4)q=r;else if(c===3){if(t1<0)t1=r;else if(t2<0)t2=r;}else if(c===2){if(p1<0)p1=r;else if(p2<0)p2=r;}}
  if(q>=0)return(7<<20)|(q<<16)|kick(mask&~(1<<q),1,12);
  if(t1>=0&&(t2>=0||p1>=0))return(6<<20)|(t1<<16)|(Math.max(t2,p1)<<12);
  if(fs>=0)return(5<<20)|kick(_sm[fs],5,16);
  const sh=STR[mask];if(sh>=0)return(4<<20)|(sh<<16);
  if(t1>=0)return(3<<20)|(t1<<16)|kick(mask&~(1<<t1),2,12);
  if(p2>=0)return(2<<20)|(p1<<16)|(p2<<12)|kick(mask&~(1<<p1)&~(1<<p2),1,8);
  if(p1>=0)return(1<<20)|(p1<<16)|kick(mask&~(1<<p1),3,12);
  return kick(mask,5,16);
}
function rankCN(r){return r===8?'10':RANK_CH[r];}
function handName(v){const c=v>>20,a=(v>>16)&15,b=(v>>12)&15;
  switch(c){case 8:return a===12?'皇家同花顺':`同花顺（${rankCN(a)} 高）`;case 7:return `四条 ${rankCN(a)}`;case 6:return `葫芦（${rankCN(a)} 带 ${rankCN(b)}）`;
  case 5:return `同花（${rankCN(a)} 高）`;case 4:return `顺子（${rankCN(a)} 高）`;case 3:return `三条 ${rankCN(a)}`;case 2:return `两对 ${rankCN(a)} 和 ${rankCN(b)}`;
  case 1:return `一对 ${rankCN(a)}`;default:return `高牌 ${rankCN(a)}`;}}

/* ================= ranges ================= */

function clsName(k){const i=Math.floor(k/13),j=k%13;if(i===j)return DESC[i]+DESC[i];return i<j?DESC[i]+DESC[j]+'s':DESC[j]+DESC[i]+'o';}

function mergedFreq(tbl,k,m){let r=tbl.r[k],c=Math.min(tbl.c[k],1-r),f=Math.max(0,1-r-c);if(m.noRaise){c+=r;r=0;}if(m.check){c+=f;f=0;}return{raise:r,call:c,fold:f};}

/* ================= helpers ================= */
const $=s=>document.querySelector(s);

/* ================= hand classification (postflop) ================= */

function rangeDist(q,dead){

const SIZE_LIST=[0.33,0.5,0.75,1,1.5];

    f=0.33;R.push('翻前你是加注者，在干燥牌面上你的范围比对手强：超对和高张更多，对手大部分牌完全没中。');

  }else if(kind==='thin'){

  let N,Rn;
  if(m.check){N=1326;Rn=Math.min(Rr*st.a*(st.w>1?1.2:1),1326*st.cap);}
  else{
    N=Math.min(Math.max(C*st.w,6),1326*st.cap);
    if(openish)Rn=N*st.open;
    else Rn=N*Math.min(1,C>0?Rr/C*st.a:0);
  }
  const arr=new Array(169);let cum=0;
  for(const k of RANK){
    const n=clsCombos(k),inN=Math.min(Math.max(N-cum,0),n)/n,inR=Math.min(Math.max(Rn-cum,0),n)/n;
    let raise=Math.min(inR,inN),call=inN-raise,fold=1-inN;
    if(m.check){call+=fold;fold=0;}
    if(m.noRaise){call+=raise;raise=0;}
    arr[k]={raise,call,fold};cum+=n;
  }

}
function stylePre(p,st,adv){
  const arr=styleArr(st,adv);adv.pre.arr=arr;adv.pre.floor=st.rand?0.02:0;
  const x=arr[adv.k];
  return adv.opts.map(o=>{const y=Object.assign({},o);y.f=o.t==='fold'?x.fold:o.t==='raise'?x.raise:x.call;
    if(o.t==='raise'&&st.size==='rand'){const max=p.stack+p.bet;y.to=Math.min(max,Math.max(G.currentBet+G.minRaise,round5(o.to*(0.8+Math.random()*1.2))));}
    return y;});
}
function stylePost(p,st,adv){
  const o=adv.opts.map(x=>Object.assign({},x)),get=t=>o.find(x=>x.t===t);
  const mv=(a,b,amt)=>{if(!a||!b)return;amt=Math.max(0,Math.min(amt,a.f));a.f-=amt;b.f+=amt;};
  if(get('fold')){
    const F=get('fold'),Cc=get('call'),Rr=get('raise');
    if(st.stick>0)mv(F,Cc,st.stick*F.f);else if(adv.eq<0.6)mv(Cc,F,-st.stick*Cc.f);
    if(Rr){if(st.agg>0)mv(Cc,Rr,st.agg*Cc.f*(adv.eq>0.35?1:0.5));else mv(Rr,Cc,-st.agg*Rr.f);}
  }else{
    const K=get('check'),Bt=get('bet');
    if(Bt){const g=adv.eq>=0.5?st.agg:st.bluff;if(g>0)mv(K,Bt,g*K.f);else mv(Bt,K,-g*Bt.f);}
  }
  const max=p.stack+p.bet,pot=potTotal();
  for(const x of o){
    if(!(x.t==='bet'||x.t==='raise')||!x.to||x.to>=max)continue;
    const mult=st.size==='rand'?0.5+Math.random()*1.3:st.size;if(mult===1)continue;
    const minTo=Math.min(G.currentBet+G.minRaise,max);
    let to=x.t==='bet'?round5(Math.max(BB,x.to*mult)):round5(G.currentBet+(x.to-G.currentBet)*mult);
    to=Math.min(max,Math.max(minTo,to));if(x.t==='bet'&&to>=0.7*max)to=max;x.to=to;
  }
  return o;
}
function styleMult(m,t,b,st){
  const weak=b==='air'||b==='weak'||b==='weakdraw';
  if(t==='bet'||t==='raise'){
    if(weak)return st.bluff>0?m+st.bluff*(1-m)*0.5:m*(1+st.bluff);
    if(b==='medium'&&st.agg<0)return m*(1+st.agg);
    return m;
  }
  if(t==='call'){if(b!=='strong'&&b!=='good')return st.stick>0?m+st.stick*(1-m):m*(1+st.stick);return m;}
  if((b==='strong'||b==='good')&&st.agg<0)return m+(-st.agg)*(1-m);
  if(weak&&st.bluff>0)return m*(1-st.bluff*0.5);
  return m;
}

/* ================= actions ================= */
function act(pi,t,to){
  const p=P[pi];let txt='';
  if(t==='fold'){p.folded=true;txt='弃牌';p.lastT='fold';}
  else if(t==='check'){txt='过牌';p.lastT='call';}
  else if(t==='call'){
    const amt=Math.min(G.currentBet-p.bet,p.stack);put(p,amt);p.lastT='call';
    txt=p.allIn?`跟注全下 ${fmt(amt)}`:`跟注 ${fmt(amt)}`;
    if(G.street===0){if(G.raiseLevel===0)G.limpers.push(pi);else G.callers++;}
  }else{
    const max=p.stack+p.bet;to=Math.min(Math.max(to,Math.min(G.currentBet+G.minRaise,max)),max);
    const inc=to-G.currentBet,wasBet=G.currentBet===0;
    if(inc>=G.minRaise)G.minRaise=inc;
    put(p,to-p.bet);
    if(to>G.currentBet){G.currentBet=to;for(const q of P)if(q!==p&&!q.folded&&!q.allIn)q.acted=false;}
    if(G.street===0){if(G.raiseLevel===0)G.isoLimpers=G.limpers.length;G.raiseLevel++;G.raisers.push(pi);G.raiseTo.push(to);G.callers=0;}
    G.aggr[G.street]=pi;G.nb++;p.lastT='raise';
    txt=p.allIn?`全下 ${fmt(to)}`:wasBet?`下注 ${fmt(to)}`:`加注到 ${fmt(to)}`;
  }
  p.acted=true;p.last=txt;
  log(`${who(p)}：${txt}`);
}
function pfUpdate(p,adv,t){
  if(t==='fold'||!adv.pre)return;
  const key=(t==='check'||t==='call')?'call':'raise';
  const arr=adv.pre.arr,fl=p.isUser?0.03:(adv.pre.floor||0);
  for(let k=0;k<169;k++){const f=arr?arr[k][key]:mergedFreq(adv.pre.tbl,k,adv.pre.m)[key];p.pfW[k]*=Math.max(f,fl);}
}
function narrow(p,t){
  const tb=(t==='bet'||t==='raise')?AGG:t==='call'?CALLM:CHECKM;const B=G.board,st=styleOf(p),plain=st===STYLE_DEF.gto;
  for(const c of p.combos){if(c[2]<=0)continue;if(B.includes(c[0])||B.includes(c[1])){c[2]=0;continue;}const b=classify(c[0],c[1],B).b;c[2]*=plain?tb[b]:styleMult(tb[b],t,b,st);}
}
function commit(pi,adv,t,to){
  const p=P[pi];
  if(G.street===0)pfUpdate(p,adv,t);
  act(pi,t,to);
  if(G.street>0&&t!=='fold')narrow(p,t==='check'?'check':t);
  afterAction(pi);
}
function sample(opts){let x=Math.random(),acc=0;for(const o of opts){acc+=o.f;if(x<acc)return o;}return opts.reduce((a,b)=>b.f>a.f?b:a);}
function botMove(pi){
  if(G.over||G.toAct!==pi)return;
  const p=P[pi],st=styleOf(p);
  const adv=computeAdvice(pi,450,false);
  let opts=adv.opts;
  if(st!==STYLE_DEF.gto)opts=adv.street===0?stylePre(p,st,adv):stylePost(p,st,adv);
  const s=opts.reduce((a,x)=>a+x.f,0);if(s>0)opts.forEach(x=>x.f/=s);
  let o=sample(opts);
  if(st.rand&&Math.random()<st.rand){const legal=opts.filter(x=>x.t!=='fold');o=legal[(Math.random()*legal.length)|0]||o;}
  commit(pi,adv,o.t,o.to);
}
function afterAction(pi){
  const alive=P.filter(q=>!q.folded);
  if(alive.length===1)return finishByFold(alive[0]);
  const n=nextNeeding(pi);
  if(n<0)return endStreet();
  G.toAct=n;schedule();
}
function endStreet(){
  for(const q of P)q.bet=0;
  G.currentBet=0;G.minRaise=BB;
  if(G.street===3)return showdown();
  G.street++;
  if(G.street===1){G.deck.pop();G.board.push(G.deck.pop(),G.deck.pop(),G.deck.pop());for(const q of P)if(!q.folded)q.combos=buildCombos(q.pfW,q.isUser);}
  else{G.deck.pop();G.board.push(G.deck.pop());}
  G.nb=0;for(const q of P){q.acted=false;if(!q.folded&&!q.allIn){q.last='';q.lastT='';}}
  log(`${STREET_CN[G.street]}：${G.board.map(cardTxt).join(' ')} · 底池 ${fmt(potTotal())}bb`,'st');
  const canAct=P.filter(q=>!q.folded&&!q.allIn).length;
  if(canAct<=1){G.toAct=-1;render();G.timer=setTimeout(endStreet,G.fast?0:800);return;}
  G.toAct=nextNeeding(G.button);schedule();
}
function showdown(){
  const alive=P.filter(q=>!q.folded),vals={};
  for(const q of alive)vals[q.i]=evalHand(q.hole.concat(G.board));
  const levels=[...new Set(alive.map(q=>q.total))].sort((a,b)=>a-b);
  const won=new Array(9).fill(0);let prev=0,lastW=[];
  for(const L of levels){
    let amt=0;for(const q of P)amt+=Math.max(0,Math.min(q.total,L)-prev);
    const el=alive.filter(q=>q.total>=L);let best=-1;for(const q of el)best=Math.max(best,vals[q.i]);
    const ws=el.filter(q=>vals[q.i]===best);const share=Math.floor(amt/ws.length);let rem=amt-share*ws.length;
    for(const q of ws){won[q.i]+=share+(rem>0?1:0);if(rem>0)rem--;}
    prev=L;lastW=ws;
  }
  let left=0;for(const q of P)left+=Math.max(0,q.total-prev);if(left>0&&lastW.length)won[lastW[0].i]+=left;
  for(const q of P){q.stack+=won[q.i];}
  for(const q of alive){q.last=handName(vals[q.i]);q.lastT=won[q.i]>0?'win':'';}
  G.result={won,vals,showdown:true};
  for(const q of alive)log(`${who(q)} 亮牌 ${q.hole.map(cardTxt).join(' ')} · ${handName(vals[q.i])}${won[q.i]?` · 赢 ${fmt(won[q.i])}bb`:''}`);
  finishHand();
}
function finishByFold(w){
  const pot=potTotal();w.stack+=pot;const won=new Array(9).fill(0);won[w.i]=pot;
  G.result={won,showdown:false};w.last=`赢 ${fmt(pot)}`;w.lastT='win';
  log(`${who(w)} 无人跟注，赢得底池 ${fmt(pot)}bb`);
  finishHand();
}
function handDelta(net){
  const d=blankStats();d.hands=1;d.th=1;d.net=net;
  d.won=G.result&&G.result.won[0]>0?1:0;d.vpip=G.hv?1:0;d.pfr=G.hp?1:0;
  const pk='p'+P[0].pos;
  for(const x of G.decisions){
    if(x.approx)continue;
    d.dec++;d.score+=x.rating.score;const s=d.st['s'+x.street];s.d++;s.s+=x.rating.score;
    if(x.rating.lvl==='meh'||x.rating.lvl==='bad')s.b++;
    d.pos[pk].d++;d.pos[pk].s+=x.rating.score;if(x.mis)d.mis[x.mis]++;
  }
  return d;
}
function recordHand(d){
  if(ACCT.user)return pushStats(d);
  addInto(STATS,d);save('gto9-stats',STATS);
}
function finishHand(){
  G.over=true;G.toAct=-1;clearTimeout(G.timer);
  const net=P[0].stack-START;
  recordHand(handDelta(net));
  log(`本手你${net>0?'赢':net<0?'输':'持平'} ${fmt(Math.abs(net))}bb`);
  render();
}

/* ================= scheduling & user input ================= */
function schedule(){
  if(G.over)return render();
  const p=P[G.toAct];
  if(p.isUser){G.cur=computeAdvice(0,3000,true);G.showAdvice=SETTINGS.mode==='live';G.uiTo=defaultTo();render();return;}
  render();
  G.timer=setTimeout(()=>botMove(p.i),G.fast?0:SPEED[SETTINGS.speed]);
}
function rate(f){
  if(f>=0.5)return{lvl:'best',txt:'最佳',score:1};
  if(f>=0.2)return{lvl:'ok',txt:'可接受（混合策略）',score:0.75};
  if(f>=0.05)return{lvl:'meh',txt:'偏离',score:0.35};
  return{lvl:'bad',txt:'错误',score:0};
}
function userLabel(t,to){
  const p=P[0];const toCall=Math.min(G.currentBet-p.bet,p.stack),max=p.stack+p.bet;
  if(t==='fold')return'弃牌';if(t==='check')return'过牌';
  if(t==='call')return `跟注 ${fmt(toCall)}`;
  if(to>=max)return `全下 ${fmt(max)}`;
  return G.currentBet===0?`下注 ${fmt(to)}`:`加注到 ${fmt(to)}`;
}
function userAct(t,to){
  if(G.over||G.toAct!==0)return;
  const adv=G.cur,opt=adv.opts.find(o=>o.t===t),f=opt?opt.f:0,approx=!!(adv.ctx&&adv.ctx.approx);
  const rating=approx?{lvl:'na',txt:'近似局面，不计分',score:0}:rate(f);
  let note='';
  if((t==='bet'||t==='raise')&&opt&&opt.to&&f>0){const ratio=to/opt.to;if(ratio>1.8||ratio<0.55)note=`尺度偏离：建议约 ${fmt(opt.to)}bb。`;}
  const best=adv.opts.reduce((a,b)=>b.f>a.f?b:a);
  const chose=userLabel(t,to);
  const RK={fold:0,check:1,call:1,bet:2,raise:2};let mis=null;
  if(rating.lvl==='meh'||rating.lvl==='bad'){const c=RK[t],b=RK[best.t];if(c<b)mis=c===0?'tight':'passive';else if(c>b)mis=(b===0&&c===1)?'loose':'aggr';}
  if(G.street===0&&t!=='fold'&&t!=='check')G.hv=true;if(G.street===0&&(t==='raise'||t==='bet'))G.hp=true;
  const d={street:G.street,sit:adv.sit,chose,best:best.label,f,rating,note,mis,approx,board:G.board.slice()};
  G.decisions.push(d);G.feedback=d;G.lastAdvice=adv;G.showAdvice=true;
  commit(0,adv,t,to);
}
function defaultTo(){
  const p=P[0],max=p.stack+p.bet;const rec=G.cur&&G.cur.opts.find(o=>o.t==='raise'||o.t==='bet');
  const minTo=Math.min(G.currentBet+G.minRaise,max);
  return rec&&rec.to?rec.to:minTo;
}
function presets(){
  const p=P[0],max=p.stack+p.bet,minTo=Math.min(G.currentBet+G.minRaise,max),pot=potTotal(),cb=G.currentBet;
  const list=[];const rec=G.cur&&G.cur.opts.find(o=>o.t==='raise'||o.t==='bet');
  if(G.street===0){
    if(G.raiseLevel===0){const base=G.limpers.length*BB;[25+base,30+base,40+base].forEach(v=>list.push({to:v,label:`${fmt(v)}bb`}));}
    else[2.2,3,4].forEach(m=>{const v=round5(cb*m);list.push({to:v,label:`${m}x`});});
  }else if(cb===0)[0.33,0.5,0.75,1].forEach(fr=>list.push({to:round5(fr*pot),label:`${Math.round(fr*100)}%`}));
  else[2.5,3,4].forEach(m=>list.push({to:round5(cb*m),label:`${m}x`}));
  list.push({to:max,label:'全下'});
  const seen=new Set(),out=[];
  for(const x of list){const v=Math.min(Math.max(x.to,minTo),max);if(seen.has(v))continue;seen.add(v);out.push({to:v,label:x.label,rec:rec&&rec.to===v});}
  if(rec&&rec.to&&!seen.has(rec.to))out.unshift({to:rec.to,label:'建议',rec:true});
  return out;
}

/* ================= rendering ================= */

function verdictHTML(){

function kindLabel(a){return a.street>0?'翻后 · 启发式近似':a.ctx&&a.ctx.approx?'翻前 · 近似建议（不计分）':'翻前 · 求解器范围近似';}

function hintHTML(x){

function reviewHTML(){

      G.decisions.map(d=>`<tr><td>${STREET_CN[d.street]}</td><td>${d.chose}</td><td>${d.best}</td><td><span class="rv lv-${d.rating.lvl}">${d.rating.txt}</span>${d.approx?'':' '+pc(d.f)}${d.note?`<br><span class="lbl">${d.note}</span>`:''}</td></tr>`).join('')+'</tbody></table></div>';

const ACCT={fb:null,user:null,stats:null,pending:false,online:typeof navigator!=='undefined'?navigator.onLine!==false:true,unsub:null,err:'',tab:'login',msg:'',busy:false,isAdmin:false};
const AUTH_ERR={'auth/email-already-in-use':'这个邮箱已经注册过了，直接登录就行。','auth/invalid-email':'邮箱格式不对。','auth/missing-email':'请先填写邮箱。','auth/weak-password':'密码至少要 6 位。','auth/missing-password':'请填写密码。','auth/invalid-credential':'邮箱或密码不对。','auth/invalid-login-credentials':'邮箱或密码不对。','auth/wrong-password':'邮箱或密码不对。','auth/user-not-found':'这个邮箱还没有注册。','auth/network-request-failed':'连不上服务器。登录和注册需要联网；登录过一次之后，离线也能继续用。','auth/too-many-requests':'尝试次数太多，请过几分钟再试。'};

function fsInc(v){return firebase.firestore.FieldValue.increment(v);}

function toIncrements(o){const r={};for(const k in o){const v=o[k];if(v&&typeof v==='object'){const sub=toIncrements(v);if(Object.keys(sub).length)r[k]=sub;}else if(typeof v==='number'&&v)r[k]=fsInc(v);}return r;}
function userRef(){return ACCT.fb.db.collection('users').doc(ACCT.user.uid);}
function pushStats(d){

function initAccount(){
  if(!fbReady())return;

    if(!firebase.apps.length)firebase.initializeApp(window.FIREBASE_CONFIG);

  window.addEventListener('online',()=>{ACCT.online=true;renderAccount();});

  ACCT.fb.auth.onAuthStateChanged(u=>{
    if(ACCT.unsub){ACCT.unsub();ACCT.unsub=null;}
    ACCT.user=u;ACCT.stats=null;ACCT.pending=false;ACCT.err='';ACCT.isAdmin=false;
    if(u){
      const ref=userRef();

      ref.set({name:nm,email:u.email||'',lastActive:fsNow()},{merge:true}).catch(()=>{});
      ACCT.unsub=ref.onSnapshot({includeMetadataChanges:true},snap=>{
        const d=snap.data()||{};ACCT.stats=normStats(d.stats);ACCT.name=d.name||nm;ACCT.pending=snap.metadata.hasPendingWrites;
        renderStats();renderAccount();
      },e=>{ACCT.err='读取账号数据失败：'+e.message;renderAccount();});
      ACCT.fb.db.collection('admins').doc(u.uid).get().then(a=>{ACCT.isAdmin=a.exists;renderAccount();}).catch(()=>{});

async function onAuthSubmit(e){
  e.preventDefault();if(ACCT.busy)return;
  const v=id=>{const el=document.getElementById(id);return el?el.value.trim():'';};
  const email=v('inEmail'),pass=document.getElementById('inPass')?document.getElementById('inPass').value:'',name=v('inName');
  ACCT.err='';ACCT.msg='';
  if(!email){ACCT.err='请填写邮箱。';return renderAccount();}
  if(ACCT.tab==='signup'&&!name){ACCT.err='请填写昵称。';return renderAccount();}
  ACCT.busy=true;renderAccount();
  const auth=ACCT.fb.auth;
  try{
    if(ACCT.tab==='reset'){await auth.sendPasswordResetEmail(email);ACCT.msg='重置邮件已发送。去邮箱点开链接设置新密码（也看看垃圾邮件文件夹）。';}
    else if(ACCT.tab==='signup'){
      const cred=await auth.createUserWithEmailAndPassword(email,pass);
      await cred.user.updateProfile({displayName:name});ACCT.name=name;
      ACCT.fb.db.collection('users').doc(cred.user.uid).set({name,email,createdAt:fsNow(),lastActive:fsNow()},{merge:true}).catch(()=>{});
    }else await auth.signInWithEmailAndPassword(email,pass);
  }catch(err){ACCT.err=authErr(err);}
  ACCT.busy=false;renderAccount();renderStats();
}
function esc(t){return String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}


function renderOppBtn(){
  const cnt={};for(const k of SETTINGS.styles)cnt[k]=(cnt[k]||0)+1;
  const pre=STYLE_PRESETS.find(([,a])=>a.join()===SETTINGS.styles.join());
  $('#oppBtn').textContent=pre?pre[0]:STYLE_KEYS.filter(k=>cnt[k]).map(k=>`${STYLE_DEF[k].n}×${cnt[k]}`).join(' ');
}
function renderOpp(){
  const el=$('#oppSheet');
  let h=`<button class="x" id="oppClose" aria-label="关闭">×</button><h2 id="oppTitle">对手类型</h2>
  <p class="fine">从下一手开始生效。GTO 建议和评分不会因为对手类型而改变；翻后胜率会按对手的类型估计他的范围，并给出剥削提示。</p>
  <div class="row presets">${STYLE_PRESETS.map(([n],i)=>`<button class="pre${STYLE_PRESETS[i][1].join()===SETTINGS.styles.join()?' on':''}" data-p="${i}">${n}</button>`).join('')}<button class="pre" data-p="rand">随机</button></div>
  <div class="opplist">${NAMES.slice(1).map((nm,i)=>`<label for="sty${i}"><span>${nm}</span><select id="sty${i}" data-i="${i}">${STYLE_KEYS.map(k=>`<option value="${k}"${SETTINGS.styles[i]===k?' selected':''}>${STYLE_DEF[k].full}</option>`).join('')}</select></label>`).join('')}</div>
  <dl class="styd">${STYLE_KEYS.map(k=>`<div><dt><span class="sty sty-${k}">${STYLE_DEF[k].n}</span></dt><dd>${STYLE_DEF[k].d}</dd></div>`).join('')}</dl>`;
  el.innerHTML=h;
  $('#oppClose').onclick=()=>{$('#oppModal').hidden=true;};
  el.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{
    SETTINGS.styles=b.dataset.p==='rand'?SETTINGS.styles.map(()=>STYLE_KEYS[(Math.random()*STYLE_KEYS.length)|0]):STYLE_PRESETS[+b.dataset.p][1].slice();
    save('gto9-settings',SETTINGS);renderOpp();renderOppBtn();});
  el.querySelectorAll('select[data-i]').forEach(sel=>sel.onchange=()=>{SETTINGS.styles[+sel.dataset.i]=sel.value;save('gto9-settings',SETTINGS);renderOpp();renderOppBtn();});
}

/* ================= boot ================= */
function initSettings(){
  const sp=$('#setPos'),sm=$('#setMode'),ss=$('#setSpeed');
  sp.value=SETTINGS.pos;sm.value=SETTINGS.mode;ss.value=SETTINGS.speed;
  sp.onchange=()=>{SETTINGS.pos=sp.value;save('gto9-settings',SETTINGS);};
  sm.onchange=()=>{SETTINGS.mode=sm.value;save('gto9-settings',SETTINGS);if(G.toAct===0&&!G.over){G.showAdvice=SETTINGS.mode==='live';render();}};
  ss.onchange=()=>{SETTINGS.speed=ss.value;save('gto9-settings',SETTINGS);};
  renderOppBtn();
  $('#oppBtn').onclick=()=>{$('#oppModal').hidden=false;renderOpp();};
  $('#oppModal').addEventListener('click',e=>{if(e.target.id==='oppModal')$('#oppModal').hidden=true;});
  document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#oppModal').hidden=true;});
  let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{if(P.length)renderTable();},80);});
}
initSettings();
initAccount();
newHand();
</script>
