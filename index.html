<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="德扑GTO">
<meta name="theme-color" content="#0e1318">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<script src="firebase-app-compat.js"></script>
<script src="firebase-auth-compat.js"></script>
<script src="firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<title>德扑 GTO 训练台</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+SC:wght@700;900&display=swap">
<style>
/* Layout: header strip; table + action bar on the left (primary), advice + log column on the right; stacks to one column on phones.
   Colour code follows solver convention: fold = blue, check/call = green, bet/raise = red. */
:root{
  color-scheme:dark;
  --bg:#0e1318; --panel:#151c22; --panel2:#1c252d; --line:#2a353e; --fg:#e8ecea; --muted:#93a0a8; --dim:#62707a;
  --felt:#16513f; --felt2:#0b2e25; --rail:#3b2b21; --rail2:#21170f; --brass:#d6ab52; --brass-soft:rgba(214,171,82,.18);
  --fold:#4d84d6; --call:#35a776; --raise:#de5847;
  --cardbg:#f7f4ec; --cardline:#d9d3c6; --s:#1d2126; --h:#cc3430; --d:#2a6fd0; --c:#1f8a4c;
  --ff-body:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --ff-disp:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  --ff-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--ff-body);font-size:14px;line-height:1.55}
html[lang=zh-HK] body{font-family:"Noto Sans TC",var(--ff-body)}
*{box-sizing:border-box}
[hidden]{display:none!important}
button,select,input{font:inherit;color:inherit}
.wrap{max-width:1320px;margin:0 auto;padding-block:16px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 24px;justify-content:space-between}
.brand h1{font-family:var(--ff-disp);font-weight:900;font-size:26px;margin:0;letter-spacing:.04em;line-height:1.2}
.brand h1 em{font-style:normal;color:var(--brass)}
.brand p{margin:2px 0 0;color:var(--muted);font-size:13px}
.stats{display:flex;gap:18px;flex-wrap:wrap}
.stat{display:flex;flex-direction:column}
.stat span{font-size:11px;color:var(--muted);letter-spacing:.06em}
.stat b{font-family:var(--ff-num);font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.pos{color:var(--call)} .neg{color:var(--raise)}
.settings{display:flex;flex-wrap:wrap;gap:10px}
.settings label{display:flex;flex-direction:column;font-size:11px;color:var(--muted);gap:3px;letter-spacing:.04em}
.settings select{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-size:13px;color:var(--fg)}
.settings select:focus-visible{outline:2px solid var(--brass);outline-offset:1px}

.main{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);grid-template-rows:auto auto 1fr;grid-template-areas:"table advice" "action advice" "log advice";gap:14px 16px;align-items:start}
#table{grid-area:table}#actionbar{grid-area:action}#advice{grid-area:advice}.logp{grid-area:log}
@media (max-width:940px){.main{grid-template-columns:minmax(0,1fr);grid-template-rows:none;grid-template-areas:"table" "action" "advice" "log"}}

/* table */
.tablebox{position:relative;width:100%;aspect-ratio:16/10.4;max-width:100%}
@media (max-width:600px){.tablebox{aspect-ratio:4/5.2}}
.felt{position:absolute;left:8%;right:8%;top:11%;bottom:12%;border-radius:50%;
  background:radial-gradient(ellipse at 50% 42%,var(--felt) 0%,var(--felt2) 78%);
  border:12px solid var(--rail);box-shadow:inset 0 0 0 2px rgba(0,0,0,.35),inset 0 10px 40px rgba(0,0,0,.45),0 0 0 2px var(--rail2),0 18px 40px rgba(0,0,0,.45)}
@media (max-width:600px){.felt{left:7%;right:7%;top:12%;bottom:13%;border-width:9px;border-radius:46%}}
.felt::after{content:"";position:absolute;inset:9%;border-radius:50%;border:1px solid rgba(214,171,82,.16);pointer-events:none}
.center{position:absolute;left:50%;top:47%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:8px;z-index:1}
.board{display:flex;gap:5px}
.slot{width:44px;height:62px;border-radius:6px;border:1px dashed rgba(255,255,255,.14)}
.potline{font-size:13px;color:#d9e6df;background:rgba(0,0,0,.32);padding:2px 12px;border-radius:999px;white-space:nowrap}
.potline b{font-family:var(--ff-num);color:var(--brass);font-weight:600}
.street{font-size:11px;letter-spacing:.12em;color:rgba(232,236,234,.55)}

.seat{position:absolute;transform:translate(-50%,-50%);width:108px;display:flex;flex-direction:column;align-items:center;gap:3px;z-index:2;transition:opacity .2s}
.seat.me{width:130px}
.seat .hole{display:flex;gap:3px;min-height:31px;align-items:flex-end}
.plate{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:2px 8px;width:100%;display:flex;justify-content:space-between;align-items:baseline;gap:6px;font-size:12px;white-space:nowrap}
.plate .nm{overflow:hidden;text-overflow:ellipsis}
.plate .ps{font-family:var(--ff-num);font-size:11px;color:var(--brass);font-weight:600}
.stk{font-family:var(--ff-num);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;line-height:1.2}
.tag{font-size:11px;line-height:1.5;padding:0 8px;border-radius:999px;background:rgba(0,0,0,.45);color:var(--fg);white-space:nowrap;max-width:140px;overflow:hidden;text-overflow:ellipsis}
.tag.t-fold{color:#9dbbe8}.tag.t-call{color:#8fdcb6}.tag.t-raise{color:#f5a196}.tag.t-win{background:var(--call);color:#06150e;font-weight:700}
.seat.me .plate{background:#24313b;border-color:#3a4955}
.seat.turn .plate{border-color:var(--brass);box-shadow:0 0 0 3px var(--brass-soft)}
.seat.out{opacity:.42}
.seat.win .plate{border-color:var(--call)}
@media (max-width:600px){
  .seat{width:78px}.seat.me{width:112px}
  .plate{padding:1px 5px;font-size:11px}.plate .ps{font-size:10px}
  .stk{font-size:11px}.tag{font-size:10px;padding:0 6px;max-width:92px}
  .slot{width:34px;height:48px}
  .board{gap:4px}
}
.chip{position:absolute;transform:translate(-50%,-50%);font-family:var(--ff-num);font-size:12px;font-weight:600;color:#1a1408;background:var(--brass);padding:0 7px;border-radius:999px;box-shadow:0 2px 0 rgba(0,0,0,.35);z-index:1;white-space:nowrap}
.dealer{position:absolute;transform:translate(-50%,-50%);width:22px;height:22px;border-radius:50%;background:#f1ece0;color:#1b1b1b;font-weight:700;font-size:12px;display:grid;place-items:center;box-shadow:0 2px 0 rgba(0,0,0,.4);z-index:1}

/* cards */
.card{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;background:var(--cardbg);border:1px solid var(--cardline);border-radius:6px;font-family:var(--ff-num);font-weight:600;line-height:1;box-shadow:0 2px 3px rgba(0,0,0,.35);flex:none}
.card b{font-weight:600}.card i{font-style:normal}
.card.md{width:44px;height:62px;font-size:19px;gap:3px}.card.md i{font-size:18px}
.card.lg{width:44px;height:62px;font-size:19px;gap:3px}.card.lg i{font-size:18px}
.card.sm{width:23px;height:32px;font-size:11px;border-radius:4px;gap:1px}.card.sm i{font-size:10px}
.card.xs{width:20px;height:27px;font-size:10px;border-radius:3px;gap:0;vertical-align:middle;box-shadow:none}.card.xs i{font-size:9px}
.card.s-s{color:var(--s)}.card.s-h{color:var(--h)}.card.s-d{color:var(--d)}.card.s-c{color:var(--c)}
.card.back{background:repeating-linear-gradient(45deg,#7d2a26 0 4px,#93352f 4px 8px);border:2px solid #f1ece0}
@media (max-width:600px){.card.md,.card.lg{width:34px;height:48px;font-size:15px}.card.md i,.card.lg i{font-size:14px}.card.sm{width:18px;height:26px;font-size:9px}.card.sm i{font-size:8px}}

/* action bar */
.actionbar{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;min-height:64px}
.info{display:flex;flex-wrap:wrap;gap:4px 16px;color:var(--muted);font-size:13px}
.info b{font-family:var(--ff-num);color:var(--fg);font-weight:600}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:0;border-radius:9px;padding:9px 16px;font-weight:700;font-size:15px;cursor:pointer;min-width:84px;transition:transform .06s,filter .15s}
.btn:hover{filter:brightness(1.1)}.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.btn.fold{background:var(--fold);color:#fff}.btn.call{background:var(--call);color:#04140c}.btn.raise{background:var(--raise);color:#fff}
.btn.primary{background:var(--brass);color:#1a1408}.btn.ghost{background:var(--panel2);border:1px solid var(--line);color:var(--fg);font-weight:500}
.sizer{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.pre{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:3px 11px;font-size:12px;cursor:pointer;color:var(--fg)}
.pre.on{border-color:var(--raise);color:#f5a196}
.pre.rec{box-shadow:inset 0 0 0 1px var(--brass)}
.sizer input[type=range]{flex:1 1 140px;min-width:0;accent-color:var(--raise)}
.sizer input[type=number]{width:78px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:4px 6px;font-family:var(--ff-num)}
.wait{color:var(--muted)}
.verdict{display:flex;gap:8px;align-items:flex-start;font-size:13px;line-height:1.45;padding:6px 10px;border-radius:8px;background:var(--panel2);border-left:3px solid var(--dim)}
.verdict .vi{font-weight:700;font-size:16px;line-height:1.25;flex:none}
.verdict b{font-weight:700}
.verdict.lv-best{border-left-color:var(--call)}.verdict.lv-best .vi{color:var(--call)}
.verdict.lv-ok{border-left-color:var(--brass)}.verdict.lv-ok .vi{color:var(--brass)}
.verdict.lv-meh{border-left-color:#e08a3a}.verdict.lv-meh .vi{color:#e08a3a}
.verdict.lv-bad{border-left-color:var(--raise)}.verdict.lv-bad .vi{color:var(--raise)}
.mini{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.mini .fbar{height:8px}
.hs{font-size:13px;color:var(--muted)}
.copyb{font-size:13px;padding:8px 12px;min-width:0}
.copyrow{display:flex;justify-content:flex-end;margin-top:-4px}
.copyrow .lnk{font-size:12.5px}
#copyTa{width:100%;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px;font-family:var(--ff-num);font-size:12px;resize:vertical}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--call);color:#04140c;font-weight:700;padding:10px 16px;border-radius:10px;z-index:60;box-shadow:0 6px 20px rgba(0,0,0,.4);max-width:calc(100% - 32px);text-align:center}
.ver{font-family:var(--ff-num);font-size:12px;font-weight:600;color:var(--brass);background:var(--brass-soft);border:0;border-radius:999px;padding:1px 9px;vertical-align:5px;cursor:pointer;letter-spacing:0}
.ver:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.cls{display:flex;flex-direction:column;gap:14px;max-height:min(60vh,520px);overflow-y:auto}
.cl h3{margin:0 0 6px;font-size:15px;font-family:var(--ff-num)}.cl h3 small{font-family:var(--ff-body);font-weight:400;color:var(--muted);font-size:12px;margin-left:6px}
.cl ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.cl li{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:baseline;font-size:13.5px}
.clt{font-size:11px;font-weight:700;border-radius:4px;padding:0 6px;white-space:nowrap}
.clt-fix{background:rgba(222,88,71,.2);color:#f5a196}.clt-new{background:rgba(53,167,118,.2);color:#8fdcb6}.clt-imp{background:rgba(77,132,214,.22);color:#9dbbe8}
.warnbox{background:rgba(224,138,58,.12);border:1px solid rgba(224,138,58,.45);color:#f0c49a;border-radius:9px;padding:8px 10px;font-size:13px}
.verdict.lv-na{border-left-color:var(--dim)}.verdict.lv-na .vi{color:var(--muted)}
.fb.lv-na{border-left-color:var(--dim)}.fb.lv-na .badge{color:var(--muted)}
.rv.lv-na{color:var(--muted)}
.optbtn{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:13px;color:var(--fg);cursor:pointer;text-align:left;max-width:15em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.optbtn:focus-visible{outline:2px solid var(--brass);outline-offset:1px}
.sty{display:inline-block;font-family:var(--ff-body);font-size:10px;line-height:1.5;padding:0 5px;border-radius:4px;font-weight:700;vertical-align:1px}
.sty-gto{background:rgba(147,160,168,.18);color:#c3ccd1}.sty-tag{background:rgba(77,132,214,.22);color:#9dbbe8}.sty-lag{background:rgba(222,88,71,.22);color:#f5a196}
.sty-nit{background:rgba(140,111,214,.24);color:#c3b2f0}.sty-lp{background:rgba(53,167,118,.2);color:#8fdcb6}.sty-fish{background:rgba(214,171,82,.22);color:#e6c47c}.sty-tp{background:rgba(64,170,190,.2);color:#8fd3df}
.sizebox,.hint{background:var(--panel2);border-radius:9px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.hint{border-left:3px solid var(--brass)}
.sbt{font-weight:700;font-size:13.5px}
.sizebox p,.hint p{margin:0;font-size:13px;color:#d6ddd9}
.hint span{font-size:11.5px;color:var(--dim)}
.hint p.hhand{color:var(--fg);font-weight:500}
.szwrap{overflow-x:auto}
table.sz{width:100%;border-collapse:collapse;font-size:12.5px;min-width:340px}
table.sz th{text-align:left;color:var(--muted);font-weight:500;padding:4px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
table.sz td{padding:5px 6px;border-bottom:1px solid var(--line)}
table.sz td:nth-child(2),table.sz td:nth-child(3){font-family:var(--ff-num);font-variant-numeric:tabular-nums;white-space:nowrap}
table.sz td:first-child{white-space:nowrap}
table.sz tr.rec td{color:var(--fg);font-weight:700;background:rgba(214,171,82,.1)}
table.sz tr.rec td:last-child{color:var(--brass)}
p.szn{font-size:11.5px;color:var(--dim)}
.sheet.wide{max-width:520px}
.presets{gap:6px}
.opplist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (max-width:460px){.opplist{grid-template-columns:minmax(0,1fr)}}
.opplist label{flex-direction:row!important;align-items:center;justify-content:space-between;gap:8px;background:var(--panel2);border-radius:8px;padding:6px 8px;color:var(--fg)!important}
.opplist select{background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:4px 6px;font-size:13px;color:var(--fg);min-width:0}
.styd{margin:0;display:flex;flex-direction:column;gap:5px;font-size:12.5px}
.styd div{display:grid;grid-template-columns:3.6em 1fr;gap:6px;align-items:baseline}
.styd dd{margin:0;color:var(--muted)}
.acct{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:6px 14px 6px 12px;cursor:pointer;max-width:100%}
.acct span{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:12em}
.acct small{color:var(--muted);font-size:12px;white-space:nowrap}
.acct:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block;background:var(--dim)}
.dot.ok{background:var(--call)}.dot.busy{background:var(--brass)}.dot.off{background:#e08a3a}.dot.none{background:var(--dim)}
.modal{position:fixed;inset:0;background:rgba(5,8,10,.66);z-index:50;display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow-y:auto}
.sheet{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;width:100%;max-width:400px;display:flex;flex-direction:column;gap:12px;margin:auto}
.sheet h2{margin:0;font-family:var(--ff-disp);font-size:20px}
.sheet .x{position:absolute;top:8px;right:10px;background:none;border:0;font-size:24px;color:var(--muted);cursor:pointer;line-height:1;padding:4px 8px}
.sheet form{display:flex;flex-direction:column;gap:10px}
.sheet label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.sheet input{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:16px;color:var(--fg)}
.sheet input:focus-visible{outline:2px solid var(--brass);outline-offset:1px}
.sheet .tabs{display:flex;gap:4px;background:var(--panel2);border-radius:9px;padding:3px}
.sheet .tabs button{flex:1;border:0;background:none;padding:7px;border-radius:7px;cursor:pointer;color:var(--muted)}
.sheet .tabs button.on{background:var(--bg);color:var(--fg);font-weight:700}
.sheet .row{display:flex;gap:8px;flex-wrap:wrap}
.sheet .links{justify-content:center}
.lnk{background:none;border:0;color:var(--brass);cursor:pointer;padding:2px 4px;font-size:13px}
.btn.sm{padding:7px 14px;font-size:14px;min-width:0;text-decoration:none;display:inline-block}
.btn[disabled]{opacity:.6;cursor:default}
.err{color:#f5a196;margin:0;font-size:13px}.ok{color:#8fdcb6;margin:0;font-size:13px}.warn{color:#e8b07a;margin:0;font-size:13px}
.fine{color:var(--dim);font-size:12px;margin:0}
.who{display:flex;flex-direction:column}.who span{color:var(--muted);font-size:13px}
.syncrow{display:flex;gap:10px;align-items:flex-start;background:var(--panel2);border-radius:9px;padding:10px}
.syncrow .dot{margin-top:6px}.syncrow div{display:flex;flex-direction:column}.syncrow span{color:var(--muted);font-size:13px}
.mstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.mstats div{background:var(--panel2);border-radius:8px;padding:6px 8px}.mstats span{display:block;font-size:11px;color:var(--muted)}.mstats b{font-family:var(--ff-num);font-size:16px}
.merge{border:1px solid var(--brass);border-radius:9px;padding:10px;display:flex;flex-direction:column;gap:8px}.merge p{margin:0;font-size:13px}
.res{font-size:16px}.res b{font-family:var(--ff-num);font-size:20px}

/* panels */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.panel h2{margin:0;font-size:15px;font-family:var(--ff-disp);font-weight:700;display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;letter-spacing:.03em}
.kind{font-family:var(--ff-body);font-size:11px;font-weight:500;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:0 8px;letter-spacing:.02em}
.sit{margin:0;color:#cfd8d3}
.fbar{display:flex;height:14px;border-radius:4px;overflow:hidden;background:var(--panel2)}
.fbar span{display:block;height:100%}
.f-fold{background:var(--fold)}.f-check,.f-call{background:var(--call)}.f-bet,.f-raise{background:var(--raise)}
.opts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}

    for(const c of hole)_used[c]=_stamp;for(const c of board)_used[c]=_stamp;
    oc.length=0;
    for(const o of opps){
      let a=-1,b=-1;
      if(o.tot>0){for(let t=0;t<6;t++){const x=Math.random()*o.tot;let lo=0,hi=o.cum.length-1;while(lo<hi){const mid=(lo+hi)>>1;if(o.cum[mid]>x)hi=mid;else lo=mid+1;}const cm=o.arr[lo];if(_used[cm[0]]!==_stamp&&_used[cm[1]]!==_stamp){a=cm[0];b=cm[1];break;}}}

function pfContext(pi){

  if(lvl>=1&&toCall>0&&cb>=0.35*START){

  }

    if(pos===8)return{kind:'limpBB',approx:true,tbl:T.LIMP_BB};

  }

function preReasons(ctx,k,fr,rp,cp,p){

  switch(ctx.kind){

      else if(p.pos>=5&&p.pos<=6)out.push(tx('后位后面只剩少数人，而且翻后大多有位置，可以开得更宽。','From late position only a few players are left behind and you usually have position after the flop, so you can open wider.'));
      if(p.pos===7)out.push(tx('简化：小盲按“加注或弃牌”处理，真实求解器里小盲会有一部分平跟。','Simplification: the small blind is treated as raise-or-fold; a real solver also limps some hands from the SB.'));
      break;
    case 'iso':case 'limpSB':case 'limpBB':
      out.push(tx(`有人溜入时，用比正常开池稍紧的范围加注隔离，尺度约 3bb + 每个溜入者 1bb。${nm} ${verdict}。`,`Against limpers, isolate with a range slightly tighter than a normal open, sized about 3bb + 1bb per limper. ${nm} ${verdict}.`));
      if(ctx.kind==='limpBB')out.push(tx('大盲可以免费看翻牌，不值得加注的牌直接过牌。','The big blind sees the flop for free: hands not worth a raise just check.'));
      out.push(tx('GTO 打法里几乎不主动溜入，溜入范围很容易被剥削。','GTO almost never open-limps; a limping range is easy to exploit.'));
      break;
    case 'vsOpen':{
      const op=P[ctx.op];
      out.push(tx(`面对 ${POS_NAMES[op.pos]} 开池：3bet 约 ${rp}%，跟注约 ${cp}%。${nm} ${verdict}。`,`Facing a ${POS_NAMES[op.pos]} open: 3-bet about ${rp}%, call about ${cp}%. ${nm} ${verdict}.`));
      if(ctx.tier===0)out.push(tx('前位开池的范围很强，你继续的范围也要相应收紧。','An early-position opening range is strong, so your continuing range must be tighter too.'));
      if(ctx.type==='bb')out.push(tx('大盲已投入 1bb，跟注价格便宜，所以防守范围最宽。','The big blind already has 1bb in, so calling is cheap and it defends the widest.'));
      if(ctx.type==='sb')out.push(tx('小盲翻后没有位置，后面还有大盲，以 3bet 或弃牌为主，很少平跟。','The small blind is out of position after the flop and the big blind is still behind, so it mostly 3-bets or folds and rarely flats.'));
      if(ctx.type==='ipMid'){const bh=P.filter(q=>q!==p&&!q.folded&&!q.acted).length;out.push(tx(`你后面还有 ${bh} 人没行动。平跟容易被后面的人挤压（squeeze），还会让盲注便宜入池变成多人底池，所以 GTO 在这里以 3bet 或弃牌为主，平跟只用少量中小对子和同花高张。`,`${bh} player${bh>1?'s are':' is'} still to act behind you. Flatting invites a squeeze and lets the blinds in cheaply for a multiway pot, so GTO mostly 3-bets or folds here and flats only a few small/medium pairs and suited broadways.`));}

    default:out.push(tx(`面对全下级别的加注，只用最强的牌继续（约 ${Math.round((rp+cp)*10)/10}%）。${nm} ${verdict}。`,`Facing an all-in-sized raise, continue only with the strongest hands (about ${Math.round((rp+cp)*10)/10}%). ${nm} ${verdict}.`));

  return out;
}
function advisePre(pi){
  const p=P[pi],ctx=pfContext(pi),k=clsOf(p.hole[0],p.hole[1]);
  const toCall=Math.min(G.currentBet-p.bet,p.stack),max=p.stack+p.bet;
  const others=P.some(q=>q!==p&&!q.folded&&!q.allIn);
  const canRaise=p.stack>toCall&&others&&G.currentBet<max;
  const m={check:toCall===0,noRaise:!canRaise};
  const fr=mergedFreq(ctx.tbl,k,m);
  const opts=[];
  if(toCall>0)opts.push({t:'fold',f:fr.fold,label:tx('弃牌','Fold')});
  opts.push(toCall>0?{t:'call',f:fr.call,amt:toCall,label:p.stack<=toCall?tx(`跟注全下 ${fmt(toCall)}`,`Call all-in ${fmt(toCall)}`):tx(`跟注 ${fmt(toCall)}`,`Call ${fmt(toCall)}`)}:{t:'check',f:fr.call,label:tx('过牌','Check')});
  if(canRaise){const to=pfRaiseTo(pi,ctx);opts.push({t:'raise',f:fr.raise,to,label:to===max?tx(`全下 ${fmt(to)}`,`All-in ${fmt(to)}`):tx(`加注到 ${fmt(to)}`,`Raise to ${fmt(to)}`)});}
  let rp=0,cp=0;const mat=new Array(169);
  for(let j=0;j<169;j++){const x=mergedFreq(ctx.tbl,j,m);mat[j]=x;rp+=clsCombos(j)*x.raise;cp+=clsCombos(j)*(toCall>0?x.call:0);}
  rp=Math.round(rp/1326*1000)/10;cp=Math.round(cp/1326*1000)/10;
  const lr=G.raisers.length?P[G.raisers[G.raisers.length-1]]:null;
  let hint=pi===0&&lr&&lr!==p?styleHint(lr):'';
  if(hint&&toCall>0){const ex=preExploit(pi,ctx,k,1-fr.fold);if(ex)hint=Object.assign({},hint,{hand:ex});}
  return{street:0,pre:{tbl:ctx.tbl,m},ctx,k,opts,mat,rp,cp,sit:sitText(ctx,p),reasons:pi===0?preReasons(ctx,k,fr,rp,cp,p):[],sizeNote:pi===0&&canRaise?preSizeNote(ctx,p):'',hint};
}

function advisePost(pi,iters,detail){
  const p=P[pi],B=G.board,opps=P.filter(q=>q!==p&&!q.folded),n=opps.length;
  const eq=equityMC(p.hole,B,opps.map(q=>q.combos),iters);
  const pot=potTotal(),toCall=Math.min(G.currentBet-p.bet,p.stack),max=p.stack+p.bet;
  const cl=classify(p.hole[0],p.hole[1],B),tex=texture(B),street=G.street,river=street===3;

      else{kind='thin';o={check:.8,bet:.2};why.push(tx('中等牌力，有摊牌价值，以过牌控制底池为主。','Medium strength with showdown value: mostly check to control the pot.'));}

      else if(ev<0.1){o={bet:.5,check:.5};why.length=0;why.push(tx(`你的牌是中等偏强：能赢他的弱牌，但输给他约 ${pc(better)} 比你好的牌。下注只能赚一点点，所以过牌和小注薄价值混合；被加注时通常要弃牌。`,`Your hand is fairly strong: it beats his weak hands but loses to the roughly ${pc(better)} that are better. Betting earns only a little, so mix checking with a small thin value bet; if raised, you usually fold.`));}

    if(others)opts.push({t:'bet',f:o.bet||0,to,pct:Math.round(to/pot*100),label:to===max?tx(`全下 ${fmt(to)}`,`All-in ${fmt(to)}`):tx(`下注 ${fmt(to)}（${Math.round(to/pot*100)}% 底池）`,`Bet ${fmt(to)} (${Math.round(to/pot*100)}% pot)`)});

  if(tr>=10&&tr>fHi){base+=0.1;why.push(tx(`转牌 ${rankCN(tr)} 是一张大牌：翻前加注方的范围里带 ${rankCN(tr)} 的强牌更多，这张牌对你的范围更有利。`,`The ${rankCN(tr)} turn is a high card: the preflop raiser has more strong hands containing a ${rankCN(tr)}, so it favours your range.`));}
  else if(flushNew||connects){base-=(pot3&&!flushNew?0.07:0.15);why.push(tx(`转牌 ${cardTxt(turn)} ${flushNew?'带来了同花听牌':'和牌面连了起来，带来更多顺子和两对'}，对跟注方的范围更有利，下注频率要降低。`,`The ${cardTxt(turn)} turn ${flushNew?'brings a flush draw':'connects with the board, bringing more straights and two pairs'}; it favours the caller\'s range, so bet less often.`));}
  const r1=p.hole[0]>>2,r2=p.hole[1]>>2,hiB=Math.max(...B.map(c=>c>>2)),over=Math.min(r1,r2)>hiB,aceOver=Math.max(r1,r2)===12&&12>hiB;
  const b=cl.b;let f;
  if(b==='strongdraw'||b==='draw'){f=Math.min(0.85,base+0.15);why.push(tx('你有听牌：下注能让他弃牌，被跟注后河牌还有补牌。','You have a draw: betting can make him fold, and you still have outs on the river when called.'));}
  else if(eq>=vT||b==='good'||b==='medium'){f=base*(mode==='delayed'?0.85:0.65);why.push(mode==='delayed'?tx('你的牌有一定价值：下注能从他更差的牌里拿薄价值，也能保护手牌。','Your hand has some value: betting gets thin value from his worse hands and protects your hand.'):tx('你的牌有一定摊牌价值，不一定要继续下注：一部分下注拿价值，一部分过牌控制底池。','Your hand has some showdown value and need not keep betting: bet part of the time for value and check the rest to control the pot.'));}
  else if(b==='weak'){f=base*0.5;why.push(tx('弱对子有一点摊牌价值，下注频率低一些。','A weak pair has a little showdown value, so bet less often.'));}
  else if(mode==='delayed'&&aceOver&&b!=='weakdraw'){f=base*0.35;why.push(tx('这手牌有一张 A：没中也常常是最好的牌（他连续过牌的范围里有很多更差的高牌）。A 高有摊牌价值，更适合过牌摊牌，诈唬应该用完全没有摊牌价值的牌。','This hand has an ace: even unimproved it is often best (his double-check range has many worse high cards). Ace-high has showdown value and prefers to check to showdown; bluff with hands that have no showdown value at all.'));}
  else if(b==='weakdraw'||over||aceOver){f=base*(mode==='delayed'?1:0.75);why.push(tx(`这手牌${b==='weakdraw'?'有卡顺听牌':over?'两张都是高张':'有一张 A'}，被跟注后河牌还有改进机会，适合作为诈唬下注。`,`This hand ${b==='weakdraw'?'has a gutshot':over?'has two overcards':'has an ace'} and can still improve on the river when called: a good bluff.`));}
  else{f=base*(mode==='delayed'?0.6:0.35);why.push(mode==='delayed'?tx('完全没有改进机会的空气，下注频率低一些。','Air with no way to improve: bet less often.'):tx('没有听牌、也没有高张，被跟注后几乎没有改进机会，以过牌为主。','No draw and no overcards, almost no way to improve when called: mostly check.'));}
  f=Math.max(0,Math.min(0.9,f));
  return{o:{bet:f,check:1-f},why};
}

/* ================= bet sizing (with reasons) ================= */
const SIZE_LIST=[0.33,0.5,0.75,1,1.5];
function chooseSize(kind,c){
  const R=[];let f;const left=4-c.street;
  const geo=c.pot>0?(Math.pow(2*c.eff/c.pot+1,1/left)-1)/2:1;
  if(kind==='value'&&c.n===1&&c.dist){
    const vp=valueSizePlan(c);f=vp.f;R.push(...vp.R);c.vp=vp;
    const bt=c.dist.ahead!=null?c.dist.ahead:(c.eq<0.9?c.dist.strong||0:0);
    if(bt>=0.1)R.push(tx(`注意他有约 ${pc(bt)} 的牌比你好，这些牌会跟注甚至加注；下得越大，被更好的牌跟注的损失越大，所以尺度要克制。`,`Note that about ${pc(bt)} of his hands beat you; they call or even raise, and the bigger you bet the more you lose to them, so keep the size restrained.`));
  }else if(c.river){
    if(kind==='value'){
      f=0.75;R.push(tx('河牌之后没有牌要发，你的下注范围是两极化的：要么是强牌，要么是诈唬。用大尺度，强牌能从对手的抓诈牌里拿到最多。','No more cards come after the river, so your betting range is polarised: strong hands or bluffs. Bet big so your strong hands get the most from his bluff-catchers.'));
      if(c.eq>=0.85){f=1;R.push(tx('你的牌接近坚果，几乎不怕被更好的牌跟注，所以可以下满池。对手的强牌在河牌大多还是会跟。','Your hand is close to the nuts and barely fears a better hand calling, so bet the pot. His strong hands mostly still call on the river.'));}
    }else if(kind==='thin'){f=0.33;R.push(tx('这是河牌的薄价值：比你好的牌会跟，比你差的牌只有一部分会跟。小注能让对手更多较差的牌（弱对子、A 高）跟注；下大了，基本只有比你好的牌才跟。','This is a thin river value bet: better hands call, and only some worse hands do. A small bet gets more worse hands (weak pairs, ace-high) to call; bet big and basically only better hands call.'));}
    else{f=0.75;R.push(tx('河牌诈唬要和价值下注用同一个尺度，否则对手能从尺度看出你在诈唬。','River bluffs must use the same size as value bets, or your opponent can read the bluff from the size.'));R.push(tx('75% 底池时，你的诈唬只要对手弃牌超过 43% 就不亏；按 GTO 比例，你的下注范围里大约 30% 可以是诈唬。','At 75% pot a bluff breaks even if he folds more than 43% of the time; by GTO ratios about 30% of your betting range can be bluffs.'));}
  }else if(kind==='cbet'){
    if(c.tex.wet){f=0.5;R.push(tx('湿润牌面上对手的范围连得更好，持续下注的频率要降低；下注时用 50% 左右，让听牌跟注付出代价。','On a wet board his range connects better, so c-bet less often; when you bet, use about 50% so draws pay to call.'));}
    else if(c.pot3){f=0.25;R.push(tx('3bet 底池里底池已经很大，剩余筹码相对少（SPR 低）。持续下注用 25% 左右就够了：对手的空气和小对子面对任何尺度都难继续，小注让你几乎整个范围都能下，成本也低。','In a 3-bet pot the pot is already big and the stacks behind relatively small (low SPR). About 25% is enough for a c-bet: his air and small pairs struggle to continue against any size, and a small bet lets you bet almost your whole range cheaply.'));}
    else{f=0.33;R.push(tx('翻前你是加注者，在干燥牌面上你的范围比对手强：超对和高张更多，对手大部分牌完全没中。','You raised preflop, and on a dry board your range is stronger: more overpairs and high cards, while most of his hands missed completely.'));
      R.push(tx('这种局面 GTO 用小注、高频率下注：33% 底池就能逼对手弃掉大量空气，诈唬只要对手弃牌超过 25% 就不亏，而且你几乎可以用整个范围下注。','Here GTO bets small and often: 33% of the pot forces a lot of air to fold, a bluff breaks even if he folds more than 25%, and you can bet almost your whole range.'));}
  }else if(kind==='value'&&c.n>=2){
    f=c.tex.wet?0.5:0.33;
    R.push(tx(`这是 ${c.n+1} 人底池。你的价值来自几个对手各自的跟注，中等偏小的尺度能让更多人用较差的牌继续；而且人多时至少有一人中牌的概率高，下太大容易只被更好的牌跟注。`,`This is a ${c.n+1}-way pot. Your value comes from several opponents each calling, and a smallish size lets more of them continue with worse hands; with more players someone is also more likely to have hit, so a big bet tends to get called only by better hands.`));
    if(c.tex.wet)R.push(tx('湿润牌面还要兼顾保护，所以用 50%，而不是 33%：让听牌跟注的价格不那么便宜。','A wet board also calls for protection, so 50% rather than 33%: draws should not get a cheap price.'));
  }else if(kind==='value'){
    if(c.tex.wet){f=0.75;R.push(tx('湿润牌面听牌很多。下注 75% 底池时，对手的听牌跟注需要 30% 胜率，而同花听牌或两头顺听牌下一张只有约 17%–20% 的中牌率，听牌就拿不到好价格。','A wet board has many draws. Against a 75% pot bet a draw needs 30% equity to call, while a flush draw or open-ender hits only about 17%–20% on the next card, so draws do not get a good price.'));}
    else{f=0.5;R.push(tx('干燥牌面上，对手的牌很少能靠后面的牌反超，不需要用大注保护。50% 左右能让对手中等的牌（第二对、弱顶对）继续跟注，赢到的价值最多。','On a dry board his hands rarely outdraw you, so no big protection bet is needed. About 50% keeps his medium hands (second pair, weak top pair) calling and wins the most.'));}
    if(geo>f+0.08&&c.eq>=0.75){f=Math.round(Math.min(1.25,geo)*20)/20;R.push(tx(`你的牌很强，目标是到河牌时把筹码全部打进去。还剩 ${left} 条街、SPR ${c.spr.toFixed(1)}，每条街下约 ${Math.round(f*100)}% 底池（几何尺度）正好能做到，不用在最后一条街突然下一个很不自然的大注。`,`Your hand is strong and the goal is to get all the chips in by the river. With ${left} street${left>1?'s':''} left and SPR ${c.spr.toFixed(1)}, betting about ${Math.round(f*100)}% of the pot each street (geometric sizing) does exactly that, without an unnatural huge bet on the last street.`));}
  }else if(kind==='thin'){
    if(c.tex.wet){f=0.5;R.push(tx('你的牌领先，但湿润牌面上很多后门和听牌能反超你。50% 左右是折中：比小注更能让听牌付出代价，又不会大到只有更强的牌才跟。','You are ahead, but on a wet board many draws can outdraw you. About 50% is the compromise: it charges draws more than a small bet without being so big that only stronger hands call.'));}
    else{f=0.33;R.push(tx('中等牌力的薄价值下注用小注：让对手更差的牌（听牌、更小的对子）继续跟，被加注时损失也小。下大了，对手只会用比你好的牌继续。','A thin value bet with a medium hand uses a small size: worse hands (draws, smaller pairs) keep calling, and you lose little if raised. Bet big and he continues only with better hands.'));}
  }
  else if(kind==='semi'){
    f=c.tex.wet?0.66:0.5;R.push(tx('半诈唬靠两部分赚钱：对手现在弃牌，或者被跟注后你补中。中等偏大的尺度让对手弃掉更多牌，被跟注时你仍有补牌。','A semi-bluff wins two ways: he folds now, or you hit after being called. A medium-to-large size gets more folds while you keep your outs when called.'));
    R.push(tx('太小（33%）对手几乎什么牌都会跟，弃牌收益不够；太大（满池以上）一旦被跟、后面没中，损失太多。','Too small (33%) and he calls with almost anything, so you get too few folds; too big (pot or more) and you lose too much when called and you miss.'));
  }else{
    f=c.tex.wet?0.66:0.33;
    R.push(c.tex.wet?tx('湿润牌面上对手有很多听牌和弱成牌，纯诈唬要用中等偏大的尺度才能让它们弃牌。','On a wet board he has many draws and weak made hands; a pure bluff needs a medium-to-large size to fold them.'):tx('干燥牌面上对手没中的牌面对任何尺度都会弃，纯诈唬用小注就够，失败时损失最小。','On a dry board his misses fold to any size, so a small bluff is enough and loses the least when it fails.'));
  }
  if(c.n>=2&&kind!=='value'&&f>0.5){f=0.5;R.length=0;R.push(tx(`这是 ${c.n+1} 人底池，至少有一个对手中牌的概率高，${kind==='semi'?'半诈唬':'诈唬'}让所有人都弃牌很难。所以只用 50% 左右：失败时损失有限，被跟注后${kind==='semi'?'你还有补牌':'也不至于投入太多'}。`,`This is a ${c.n+1}-way pot: someone has likely hit, and a ${kind==='semi'?'semi-bluff':'bluff'} rarely folds everyone. So use only about 50%: the loss is limited when it fails, and when called ${kind==='semi'?'you still have outs':'you have not put in too much'}.`));}
  else if(c.n>=2&&kind!=='value')R.push(tx(`这是 ${c.n+1} 人底池，诈唬让所有人都弃牌更难，所以不会用更大的尺度。`,`This is a ${c.n+1}-way pot: a bluff folding everyone is harder, so no bigger size is used.`));
  let to=Math.max(round5(f*c.pot),BB),allin=false;
  if(c.spr<1.2&&(kind==='value'||kind==='thin')){to=c.max;allin=true;R.push(tx(`SPR 只有 ${c.spr.toFixed(1)}，剩下的筹码已经比底池还小，有价值时直接全下。`,`The SPR is only ${c.spr.toFixed(1)}: the stacks behind are smaller than the pot, so with value just go all-in.`));}
  else if(to>=0.7*c.max){to=c.max;allin=true;R.push(tx('按这个尺度下注后剩下的筹码已经很少，直接全下更好，不给对手便宜看下一张牌的机会。','After a bet of this size few chips would be left behind, so going all-in is better and gives him no cheap look at the next card.'));}
  const table=SIZE_LIST.map(x=>({x,need:x/(1+2*x),fold:x/(1+x),rec:Math.abs(x-f)<0.04,verdict:sizeVerdict(kind,x,f,c)}));
  if(!SIZE_LIST.some(x=>Math.abs(x-f)<0.04))table.push({x:f,need:f/(1+2*f),fold:f/(1+f),rec:true,verdict:tx('推荐','Recommended')}),table.sort((a,b)=>a.x-b.x);
  return{f,to,allin,kind,R,table,vp:c.vp||null};
}
function sizeVerdict(kind,x,f,c){const v=sizeVerdictZh(kind,x,f,c);return LANG==='en'?verdictEN(v):v;}
function verdictEN(v){
  const m=v.match(/少赢 (\d+)% 价值/),n=m?m[1]:'';
  const T={'推荐':'Recommended','略小，也可以':'Slightly small, also fine','略大，也可以':'Slightly big, also fine','偏小':'Too small','偏大：主要只会被更好的牌跟注':'Too big: mostly only better hands call',
    '偏小：少赢价值':'Too small: wins less value','偏大：主要只会被更好的牌跟注，下注反而亏':'Too big: mostly only better hands call, so the bet loses',
    '偏小：听牌拿到便宜价格，你也少赢价值':'Too small: draws get a cheap price and you win less value','可选：坚果牌超池也能拿到更多':'Option: with the nuts an overbet can win more',
    '偏大：中等牌都会弃，主要只剩更强的牌跟':'Too big: medium hands all fold and mostly stronger hands call','偏大：更多中等牌会弃掉':'Too big: more medium hands fold',
    '偏大：较差的牌不跟了，主要被更好的牌跟注':'Too big: worse hands stop calling and mostly better hands call','偏大：你范围里空气多，大注时对手只用好牌继续，诈唬成本变高':'Too big: your range has a lot of air; against a big bet he continues only with good hands and bluffing costs more',
    '偏小：对手弃牌不够，半诈唬收益低':'Too small: not enough folds, the semi-bluff earns little','偏大：被跟注后没中，损失太多':'Too big: you lose too much when called and you miss',
    '偏小：对手跟注太便宜，弃牌不够':'Too small: calling is too cheap for him and he does not fold enough','偏大：需要对手弃得更多才不亏':'Too big: he has to fold more often for it to break even'};
  if(T[v])return T[v];
  if(m)return v.startsWith('偏小')?`Too small: wins ${n}% less value`:`Too big: fewer hands call, wins ${n}% less value`;
  return v;
}
function sizeVerdictZh(kind,x,f,c){
  if(Math.abs(x-f)<0.04)return'推荐';
  const small=x<f;
  if(Math.abs(x-f)<=0.12&&!(kind==='cbet'))return small?'略小，也可以':'略大，也可以';
  if(kind==='value'&&c.vp){
    const ev=valueEV(c.dist,x,c),best=c.vp.bestEv;
    if(best<=0.005)return small?'偏小':'偏大：主要只会被更好的牌跟注';
    if(ev<=0)return small?'偏小：少赢价值':'偏大：主要只会被更好的牌跟注，下注反而亏';
    const r=ev/best;
    if(r>=0.93)return small?'略小，也可以':'略大，也可以';
    return small?`偏小：少赢 ${Math.round((1-r)*100)}% 价值`:`偏大：能跟的牌变少，少赢 ${Math.round((1-r)*100)}% 价值`;
  }
  switch(kind){
    case 'value':
      if(small)return c.tex.wet&&!c.river?'偏小：听牌拿到便宜价格，你也少赢价值':'偏小：少赢价值';
      if(c.river&&c.eq>=0.85)return'可选：坚果牌超池也能拿到更多';
      return x>=1.5?'偏大：中等牌都会弃，主要只剩更强的牌跟':'偏大：更多中等牌会弃掉';
    case 'thin':return small?'偏小':'偏大：较差的牌不跟了，主要被更好的牌跟注';
    case 'cbet':return small?'偏小':'偏大：你范围里空气多，大注时对手只用好牌继续，诈唬成本变高';
    case 'semi':return small?'偏小：对手弃牌不够，半诈唬收益低':'偏大：被跟注后没中，损失太多';
    default:return small?'偏小：对手跟注太便宜，弃牌不够':'偏大：需要对手弃得更多才不亏';
  }
}
function preSizeNote(ctx,p){
  switch(ctx.kind){
    case 'rfi':return p.pos===7?tx('开池尺度 3bb：小盲翻后一定没位置，开大一点让大盲跟注更贵。','Open to 3bb: the small blind is always out of position after the flop, so a bigger open makes the big blind pay more to call.'):tx('开池尺度 2.5bb：九人桌后面还有很多人没行动，小一点的开池在被 3bet 时损失小，同时已经足够让盲注为跟注付出代价。','Open to 2.5bb: at a 9-handed table many players are still to act, so a smaller open loses less when 3-bet while still making the blinds pay to call.');
    case 'iso':case 'limpSB':case 'limpBB':return tx('隔离加注要比正常开池大：大约 3bb，再加上每个溜入者 1bb。否则溜入的人能以很好的价格跟进来，变成多人底池，对你不利。','An isolation raise is bigger than a normal open: about 3bb plus 1bb per limper. Otherwise the limpers come along at a great price and you end up in a multiway pot, which is bad for you.');
    case 'vsOpen':return (p.pos>=7?tx('没位置 3bet 约 4 倍：翻后你要先行动，用更大的尺度让对手跟注更贵，更多时候直接弃牌。','Out of position, 3-bet about 4x: you act first after the flop, so a bigger size makes calling more expensive and gets more folds.'):tx('有位置 3bet 约 3 倍：翻后你有位置优势，不需要太大就能让对手为跟注付出代价。','In position, 3-bet about 3x: you have position after the flop, so you do not need a big size to make him pay to call.'))+(G.callers?tx(` 已经有 ${G.callers} 人跟注，每多一个跟注者再加约 1 倍。`,` ${G.callers} player${G.callers>1?'s have':' has'} already called; add about one more open-size per caller.`):'');
    case 'vs3o':case 'vs3c':return tx('4bet 约是 3bet 的 2.2–2.3 倍：100bb 深度下这已经投入了约四分之一的筹码，再大就不如直接全下。','A 4-bet is about 2.2–2.3x the 3-bet: at 100bb that already commits about a quarter of your stack, and any bigger you might as well shove.');
    case 'approx':return G.raiseLevel===1?tx(`再加注约是对手加注的 ${ctx.ip?3:4} 倍（${ctx.ip?'有位置':'没位置要更大'}），后面每多一个可能跟进的人再加约 1bb，让他们跟进来的价格变贵。`,`Re-raise to about ${ctx.ip?3:4}x his raise (${ctx.ip?'in position':'bigger out of position'}), plus about 1bb for each player behind who might come along, so joining costs them more.`):tx('这个深度下再加注基本就要投入大部分筹码。','At this depth a re-raise commits most of your stack.');
    default:return tx('这个深度下继续加注就等于全下。','At this depth any further raise is effectively all-in.');
  }

function styleOf(p){return STYLE_DEF[p&&p.style]||STYLE_DEF.gto;}
function styleHint(q){const st=styleOf(q);return q&&!q.isUser&&st.hint?{who:who(q),full:st.full,t:st.hint}:null;}
function styleArr(st,adv){
  const {tbl,m}=adv.pre,kind=adv.ctx.kind;
  let C=0,Rr=0;
  for(let k=0;k<169;k++){const x=mergedFreq(tbl,k,m),n=clsCombos(k);Rr+=n*x.raise;C+=n*(x.raise+(m.check?0:x.call));}
  const openish=kind==='rfi'||kind==='iso'||kind==='limpSB';
  let N,Rn;
  if(m.check){N=1326;Rn=Math.min(Rr*st.a*(st.w>1?1.2:1),1326*st.cap);}
  else{
    N=Math.min(Math.max(C*st.w,6),1326*st.cap);
    if(openish)Rn=N*st.open;
    else Rn=N*Math.min(1,C>0?Rr/C*st.a:0);
  }
  const arr=new Array(169);let cum=0;
  for(const k of RANK){
    const n=clsCombos(k),inN=Math.min(Math.max(N-cum,0),n)/n,inR=Math.min(Math.max(Rn-cum,0),n)/n;
    let raise=Math.min(inR,inN),call=inN-raise,fold=1-inN;
    if(m.check){call+=fold;fold=0;}
    if(m.noRaise){call+=raise;raise=0;}
    arr[k]={raise,call,fold};cum+=n;
  }

}
function stylePre(p,st,adv){
  const arr=styleArr(st,adv);adv.pre.arr=arr;adv.pre.floor=st.rand?0.02:0;
  const x=arr[adv.k];
  return adv.opts.map(o=>{const y=Object.assign({},o);y.f=o.t==='fold'?x.fold:o.t==='raise'?x.raise:x.call;
    if(o.t==='raise'&&st.size==='rand'){const max=p.stack+p.bet;y.to=Math.min(max,Math.max(G.currentBet+G.minRaise,round5(o.to*(0.8+Math.random()*1.2))));}
    return y;});
}

// How readily a style calls instead of folding, by what it holds. Calling stations call with any pair or draw
// but give up with nothing as the streets go on, more so against big bets.
function stickFor(st,b,street,aceHigh,betFrac){
  if(!st.stickB)return st.stick;
  let v=b==='air'?(aceHigh?st.stickB.airA:st.stickB.air)[Math.min(3,Math.max(1,street))-1]:(st.stickB[b]!=null?st.stickB[b]:st.stick);
  if((b==='air'||b==='weakdraw')&&betFrac>=0.75)v*=0.6;
  return v;
}
function stylePost(p,st,adv){
  const o=adv.opts.map(x=>Object.assign({},x)),get=t=>o.find(x=>x.t===t);
  const mv=(a,b,amt)=>{if(!a||!b)return;amt=Math.max(0,Math.min(amt,a.f));a.f-=amt;b.f+=amt;};
  if(get('fold')){
    const F=get('fold'),Cc=get('call'),Rr=get('raise');
    const pot=potTotal(),bf=Cc.amt?Cc.amt/Math.max(1,pot-Cc.amt):0;
    const sk=stickFor(st,adv.cl.b,G.street,adv.cl.aceHigh,bf);
    if(sk>0)mv(F,Cc,sk*F.f);else if(adv.eq<0.6)mv(Cc,F,-sk*Cc.f);
    if(Rr){if(st.agg>0)mv(Cc,Rr,st.agg*Cc.f*(adv.eq>0.35?1:0.5));else mv(Rr,Cc,-st.agg*Rr.f);}
  }else{
    const K=get('check'),Bt=get('bet');
    if(Bt){const g=adv.eq>=0.5?st.agg:st.bluff;if(g>0)mv(K,Bt,g*K.f);else mv(Bt,K,-g*Bt.f);}
  }
  const max=p.stack+p.bet,pot=potTotal();
  for(const x of o){
    if(!(x.t==='bet'||x.t==='raise')||!x.to||x.to>=max)continue;
    const mult=st.size==='rand'?0.5+Math.random()*1.3:st.size;if(mult===1)continue;
    const minTo=Math.min(G.currentBet+G.minRaise,max);
    let to=x.t==='bet'?round5(Math.max(BB,x.to*mult)):round5(G.currentBet+(x.to-G.currentBet)*mult);
    to=Math.min(max,Math.max(minTo,to));if(x.t==='bet'&&to>=0.7*max)to=max;x.to=to;
  }
  return o;
}
function styleMult(m,t,b,st,aceHigh){
  const weak=b==='air'||b==='weak'||b==='weakdraw';
  if(t==='bet'||t==='raise'){
    if(weak)return st.bluff>0?m+st.bluff*(1-m)*0.5:m*(1+st.bluff);
    if(b==='medium'&&st.agg<0)return m*(1+st.agg);
    return m;
  }
  if(t==='call'){
    if(b==='strong')return m;
    if(b==='good'&&!st.stickB)return m;
    const pot=potTotal(),bf=G.currentBet>0?G.currentBet/Math.max(1,pot-G.currentBet):0;
    const sk=stickFor(st,b,G.street,aceHigh,bf);
    return sk>0?m+sk*(1-m):m*(1+sk);
  }
  if((b==='strong'||b==='good')&&st.agg<0)return m+(-st.agg)*(1-m);
  if(weak&&st.bluff>0)return m*(1-st.bluff*0.5);
  return m;
}

/* ================= actions ================= */
function act(pi,t,to){
  const p=P[pi];let txt='';
  if(t==='fold'){p.folded=true;txt=tx('弃牌','Fold');p.lastT='fold';}
  else if(t==='check'){txt=tx('过牌','Check');p.lastT='call';}
  else if(t==='call'){
    const amt=Math.min(G.currentBet-p.bet,p.stack);put(p,amt);p.lastT='call';
    txt=p.allIn?tx(`跟注全下 ${fmt(amt)}`,`Call all-in ${fmt(amt)}`):tx(`跟注 ${fmt(amt)}`,`Call ${fmt(amt)}`);
    if(G.street===0){if(G.raiseLevel===0)G.limpers.push(pi);else G.callers++;}
  }else{
    const max=p.stack+p.bet;to=Math.min(Math.max(to,Math.min(G.currentBet+G.minRaise,max)),max);
    const inc=to-G.currentBet,wasBet=G.currentBet===0;
    if(inc>=G.minRaise)G.minRaise=inc;
    put(p,to-p.bet);
    if(to>G.currentBet){G.currentBet=to;for(const q of P)if(q!==p&&!q.folded&&!q.allIn)q.acted=false;}
    if(G.street===0){if(G.raiseLevel===0)G.isoLimpers=G.limpers.length;G.raiseLevel++;G.raisers.push(pi);G.raiseTo.push(to);G.callersAt.push(G.callers);G.callers=0;}
    G.aggr[G.street]=pi;G.nb++;p.lastT='raise';
    txt=p.allIn?tx(`全下 ${fmt(to)}`,`All-in ${fmt(to)}`):wasBet?tx(`下注 ${fmt(to)}`,`Bet ${fmt(to)}`):tx(`加注到 ${fmt(to)}`,`Raise to ${fmt(to)}`);
  }
  p.acted=true;p.last=txt;
  log(`${who(p)}${tx('：',': ')}${txt}`);
}
function pfUpdate(p,adv,t){
  if(t==='fold'||!adv.pre)return;
  const key=(t==='check'||t==='call')?'call':'raise';
  const arr=adv.pre.arr,fl=p.isUser?0.03:(adv.pre.floor||0);
  for(let k=0;k<169;k++){const f=arr?arr[k][key]:mergedFreq(adv.pre.tbl,k,adv.pre.m)[key];p.pfW[k]*=Math.max(f,fl);}

// How the size of a bet or raise shapes the range behind it: big bets are polarised (strong hands and draws,
// few medium hands); small bets are merged (more medium hands and range bets).
const POLAR={strong:1.25,good:0.8,medium:0.45,weak:0.5,strongdraw:1.25,draw:1.1,weakdraw:0.8,air:0.75};
const MERGED={strong:0.9,good:1,medium:1.2,weak:1.2,strongdraw:1,draw:1,weakdraw:1.05,air:1.1};
function narrow(p,t,frac,ctxBet){
  const tb=t==='raise'?RAISEM:t==='bet'?(ctxBet==='cbet'?(texture(G.board).wet?CBETM_WET:CBETM_DRY):ctxBet==='barrel'?BARRELM:AGG):t==='call'?CALLM:CHECKM;const B=G.board,st=styleOf(p),plain=st===STYLE_DEF.gto;
  const sz=t==='bet'&&frac!=null?(frac>=0.9?POLAR:frac<=0.4?MERGED:null):null;
  for(const c of p.combos){if(c[2]<=0)continue;if(B.includes(c[0])||B.includes(c[1])){c[2]=0;continue;}const b=classify(c[0],c[1],B).b;c[2]*=(plain?tb[b]:styleMult(tb[b],t,b,st,Math.max(c[0],c[1])>>2===12))*(sz?sz[b]:1);}
}
function commit(pi,adv,t,to){
  const p=P[pi],potBefore=potTotal(),betBefore=p.bet;
  let ctxBet=null;
  if(G.street>0&&t==='bet'){let la=-1;for(let k=G.street-1;k>=0;k--)if(G.aggr[k]>=0){la=G.aggr[k];break;}if(la===pi)ctxBet=G.street===1?'cbet':'barrel';}
  if(G.street===0)pfUpdate(p,adv,t);
  act(pi,t,to);
  if(G.street>0&&t!=='fold')narrow(p,t==='check'?'check':t,(p.bet-betBefore)/Math.max(1,potBefore),ctxBet);

}
function sample(opts){let x=Math.random(),acc=0;for(const o of opts){acc+=o.f;if(x<acc)return o;}return opts.reduce((a,b)=>b.f>a.f?b:a);}
function botMove(pi){
  if(G.over||G.toAct!==pi)return;

  const adv=computeAdvice(pi,450,false);
  let opts=adv.opts;
  if(st!==STYLE_DEF.gto)opts=adv.street===0?stylePre(p,st,adv):stylePost(p,st,adv);
  const s=opts.reduce((a,x)=>a+x.f,0);if(s>0)opts.forEach(x=>x.f/=s);

function endStreet(){

  const canAct=P.filter(q=>!q.folded&&!q.allIn).length;
  if(canAct<=1){G.toAct=-1;render();G.timer=setTimeout(endStreet,G.fast?0:800);return;}
  G.toAct=nextNeeding(G.button);schedule();
}
function showdown(){
  const alive=P.filter(q=>!q.folded),vals={};
  for(const q of alive)vals[q.i]=evalHand(q.hole.concat(G.board));
  const levels=[...new Set(alive.map(q=>q.total))].sort((a,b)=>a-b);
  const won=new Array(9).fill(0);let prev=0,lastW=[];
  for(const L of levels){
    let amt=0;for(const q of P)amt+=Math.max(0,Math.min(q.total,L)-prev);
    const el=alive.filter(q=>q.total>=L);let best=-1;for(const q of el)best=Math.max(best,vals[q.i]);
    const ws=el.filter(q=>vals[q.i]===best);const share=Math.floor(amt/ws.length);let rem=amt-share*ws.length;
    for(const q of ws){won[q.i]+=share+(rem>0?1:0);if(rem>0)rem--;}
    prev=L;lastW=ws;
  }
  let left=0;for(const q of P)left+=Math.max(0,q.total-prev);if(left>0&&lastW.length)won[lastW[0].i]+=left;
  for(const q of P){q.stack+=won[q.i];}
  for(const q of alive){q.last=handName(vals[q.i]);q.lastT=won[q.i]>0?'win':'';}
  G.result={won,vals,showdown:true};
  for(const q of alive)log(tx(`${who(q)} 亮牌 ${q.hole.map(cardTxt).join(' ')} · ${handName(vals[q.i])}${won[q.i]?` · 赢 ${fmt(won[q.i])}bb`:''}`,`${who(q)} shows ${q.hole.map(cardTxt).join(' ')} · ${handName(vals[q.i])}${won[q.i]?` · wins ${fmt(won[q.i])}bb`:''}`));

}
function finishByFold(w){
  const pot=potTotal();w.stack+=pot;const won=new Array(9).fill(0);won[w.i]=pot;
  G.result={won,showdown:false};w.last=tx(`赢 ${fmt(pot)}`,`Wins ${fmt(pot)}`);w.lastT='win';
  log(tx(`${who(w)} 无人跟注，赢得底池 ${fmt(pot)}bb`,`${who(w)} is uncalled and wins the ${fmt(pot)}bb pot`));

function handDelta(net){
  const d=blankStats();d.hands=1;d.th=1;d.net=net;
  d.won=G.result&&G.result.won[0]>0?1:0;d.vpip=G.hv?1:0;d.pfr=G.hp?1:0;
  const pk='p'+P[0].pos;
  for(const x of G.decisions){
    if(x.approx)continue;
    d.dec++;d.score+=x.rating.score;const s=d.st['s'+x.street];s.d++;s.s+=x.rating.score;
    if(x.rating.lvl==='meh'||x.rating.lvl==='bad')s.b++;
    d.pos[pk].d++;d.pos[pk].s+=x.rating.score;if(x.mis)d.mis[x.mis]++;

  return d;
}
function recordHand(d){
  if(ACCT.user)return pushStats(d);
  addInto(STATS,d);save('gto9-stats',STATS);
}
function finishHand(){
  G.over=true;G.toAct=-1;clearTimeout(G.timer);
  const net=P[0].stack-START;
  recordHand(handDelta(net));
  log(tx(`本手你${net>0?'赢':net<0?'输':'持平'} ${fmt(Math.abs(net))}bb`,`This hand you ${net>0?'won':net<0?'lost':'broke even:'} ${fmt(Math.abs(net))}bb`));
  render();
}

/* ================= scheduling & user input ================= */
function schedule(){
  if(G.over)return render();
  const p=P[G.toAct];
  if(p.isUser){G.cur=computeAdvice(0,3000,true);G.showAdvice=SETTINGS.mode==='live';G.uiTo=defaultTo();render();return;}
  render();
  G.timer=setTimeout(()=>botMove(p.i),G.fast?0:SPEED[SETTINGS.speed]);
}
function rate(f){
  if(f>=0.5)return{lvl:'best',txt:tx('最佳','Best'),score:1};
  if(f>=0.2)return{lvl:'ok',txt:tx('可接受（混合策略）','Acceptable (mixed strategy)'),score:0.75};
  if(f>=0.05)return{lvl:'meh',txt:tx('偏离','Deviation'),score:0.35};
  return{lvl:'bad',txt:tx('错误','Mistake'),score:0};
}
function userLabel(t,to){
  const p=P[0];const toCall=Math.min(G.currentBet-p.bet,p.stack),max=p.stack+p.bet;
  if(t==='fold')return tx('弃牌','Fold');if(t==='check')return tx('过牌','Check');
  if(t==='call')return tx(`跟注 ${fmt(toCall)}`,`Call ${fmt(toCall)}`);
  if(to>=max)return tx(`全下 ${fmt(max)}`,`All-in ${fmt(max)}`);
  return G.currentBet===0?tx(`下注 ${fmt(to)}`,`Bet ${fmt(to)}`):tx(`加注到 ${fmt(to)}`,`Raise to ${fmt(to)}`);
}
function userAct(t,to){
  if(G.over||G.toAct!==0)return;
  const adv=G.cur,opt=adv.opts.find(o=>o.t===t),f=opt?opt.f:0,approx=!!(adv.ctx&&adv.ctx.approx);
  const rating=approx?{lvl:'na',txt:tx('近似局面，不计分','Approximate spot, not scored'),score:0}:rate(f);
  let note='';
  if((t==='bet'||t==='raise')&&opt&&opt.to&&f>0){const ratio=to/opt.to;if(ratio>1.8||ratio<0.55)note=tx(`尺度偏离：建议约 ${fmt(opt.to)}bb。`,`Size is off: about ${fmt(opt.to)}bb recommended.`);}
  const best=adv.opts.reduce((a,b)=>b.f>a.f?b:a);
  const chose=userLabel(t,to);
  const RK={fold:0,check:1,call:1,bet:2,raise:2};let mis=null;
  if(rating.lvl==='meh'||rating.lvl==='bad'){const c=RK[t],b=RK[best.t];if(c<b)mis=c===0?'tight':'passive';else if(c>b)mis=(b===0&&c===1)?'loose':'aggr';}
  if(G.street===0&&t!=='fold'&&t!=='check')G.hv=true;if(G.street===0&&(t==='raise'||t==='bet'))G.hp=true;
  const d={street:G.street,sit:adv.sit,chose,best:best.label,f,rating,note,mis,approx,board:G.board.slice(),advText:adviceText(adv)};
  G.decisions.push(d);G.feedback=d;G.lastAdvice=adv;G.showAdvice=true;
  commit(0,adv,t,to);
}
function defaultTo(){
  const p=P[0],max=p.stack+p.bet;const rec=G.cur&&G.cur.opts.find(o=>o.t==='raise'||o.t==='bet');
  const minTo=Math.min(G.currentBet+G.minRaise,max);
  return rec&&rec.to?rec.to:minTo;
}
function presets(){
  const p=P[0],max=p.stack+p.bet,minTo=Math.min(G.currentBet+G.minRaise,max),pot=potTotal(),cb=G.currentBet;
  const list=[];const rec=G.cur&&G.cur.opts.find(o=>o.t==='raise'||o.t==='bet');
  if(G.street===0){
    if(G.raiseLevel===0){const base=G.limpers.length*BB;[25+base,30+base,40+base].forEach(v=>list.push({to:v,label:`${fmt(v)}bb`}));}
    else[2.2,3,4].forEach(m=>{const v=round5(cb*m);list.push({to:v,label:`${m}x`});});
  }else if(cb===0)[0.33,0.5,0.75,1].forEach(fr=>list.push({to:round5(fr*pot),label:`${Math.round(fr*100)}%`}));
  else[2.5,3,4].forEach(m=>list.push({to:round5(cb*m),label:`${m}x`}));
  list.push({to:max,label:tx('全下','All-in')});
  const seen=new Set(),out=[];
  for(const x of list){const v=Math.min(Math.max(x.to,minTo),max);if(seen.has(v))continue;seen.add(v);out.push({to:v,label:x.label,rec:rec&&rec.to===v});}
  if(rec&&rec.to&&!seen.has(rec.to))out.unshift({to:rec.to,label:tx('建议','Rec.'),rec:true,only:true});
  return out;
}

function plain(t){return String(t).replace(/<[^>]+>/g,'');}
function adviceText(a){
  const L=[];
  if(LANG==='en')return adviceTextEN(a);

  L.push('程序建议：'+a.opts.map(o=>`${o.label} ${pc(o.f)}`).join(' / '));
  if(a.street===0)L.push(`我的手牌类别：${clsName(a.k)}；程序在这个局面的加注范围约 ${a.rp}%${a.cp>0?`，跟注范围约 ${a.cp}%`:''}`);
  else{
    L.push(`我${a.oppNames&&a.oppNames.length>1?`同时对 ${a.oppNames.length} 个对手（${a.oppNames.join('、')}）`:'对对手'}估计范围的胜率：${pc(a.eq)}${a.potOdds!=null?`；跟注所需胜率：${pc(a.potOdds)}；MDF：${pc(a.mdf)}`:''}；SPR：${a.spr.toFixed(1)}`);
    if(a.made)L.push(`我的牌力：${a.made}（${a.cl.d}${a.cl.draw?'，'+a.cl.draw:''}）；牌面：${a.tex.label}`);
    if(a.dist&&a.mainOpp)L.push(`${who(a.mainOpp)} 的估计范围：`+BUCKET_UI.map(([k,l])=>`${l} ${pc(a.dist[k])}`).join('，'));
  }
  if(a.reasons&&a.reasons.length)L.push('程序给的理由：'+a.reasons.map(plain).join(' '));
  const bo=a.opts.find(o=>o.t==='bet');
  if(a.size&&bo&&bo.f>=0.05)L.push('程序的尺度理由：'+a.size.R.map(plain).join(' '));
  if(a.sizeNote)L.push('程序的尺度理由：'+plain(a.sizeNote));
  if(a.hint)L.push(`程序的剥削提示（${a.hint.who} 是${a.hint.full}）：${a.hint.hand?a.hint.hand+' ':''}${a.hint.t}`);
  return L;
}
function adviceTextEN(a){
  const L=[];
  L.push(`Spot: ${plain(a.sit)}`);
  if(a.ctx&&a.ctx.approx)L.push('(Program note: there is no standard chart for this spot; the advice is approximate and not scored)');
  L.push('Program advice: '+a.opts.map(o=>`${o.label} ${pc(o.f)}`).join(' / '));
  if(a.street===0)L.push(`My hand class: ${clsName(a.k)}; the program's raising range here is about ${a.rp}%${a.cp>0?`, calling range about ${a.cp}%`:''}`);
  else{
    L.push(`My equity ${a.oppNames&&a.oppNames.length>1?`against the estimated ranges of ${a.oppNames.length} opponents at once (${a.oppNames.join(', ')})`:'against the opponent\'s estimated range'}: ${pc(a.eq)}${a.potOdds!=null?`; equity needed to call: ${pc(a.potOdds)}; MDF: ${pc(a.mdf)}`:''}; SPR: ${a.spr.toFixed(1)}`);
    if(a.made)L.push(`My hand: ${a.made} — ${a.cl.d}${a.cl.draw?', '+a.cl.draw:''}; board: ${a.tex.label}`);
    if(a.dist&&a.mainOpp)L.push(`${who(a.mainOpp)}'s estimated range: `+BUCKET_UI.map(x=>`${x[2]} ${pc(a.dist[x[0]])}`).join(', '));
  }
  if(a.reasons&&a.reasons.length)L.push('Program\'s reasons: '+a.reasons.map(plain).join(' '));
  const bo=a.opts.find(o=>o.t==='bet');
  if(a.size&&bo&&bo.f>=0.05)L.push('Program\'s sizing reasons: '+a.size.R.map(plain).join(' '));
  if(a.sizeNote)L.push('Program\'s sizing reasons: '+plain(a.sizeNote));
  if(a.hint)L.push(`Program's exploit tip (${a.hint.who} is a ${a.hint.full}): ${a.hint.hand?a.hint.hand+' ':''}${a.hint.t}`);

}

async function onAuthSubmit(e){
  e.preventDefault();if(ACCT.busy)return;
  const v=id=>{const el=document.getElementById(id);return el?el.value.trim():'';};
  const email=v('inEmail'),pass=document.getElementById('inPass')?document.getElementById('inPass').value:'',name=v('inName');
  ACCT.err='';ACCT.msg='';
  if(!email){ACCT.err=tx('请填写邮箱。','Please enter your email.');return renderAccount();}
  if(ACCT.tab==='signup'&&!name){ACCT.err=tx('请填写昵称。','Please enter a nickname.');return renderAccount();}
  ACCT.busy=true;renderAccount();
  const auth=ACCT.fb.auth;
  try{
    if(ACCT.tab==='reset'){await auth.sendPasswordResetEmail(email);ACCT.msg=tx('重置邮件已发送。去邮箱点开链接设置新密码（也看看垃圾邮件文件夹）。','Reset email sent. Open the link in it to set a new password (check your spam folder too).');}
    else if(ACCT.tab==='signup'){
      const cred=await auth.createUserWithEmailAndPassword(email,pass);
      await cred.user.updateProfile({displayName:name});ACCT.name=name;
      ACCT.fb.db.collection('users').doc(cred.user.uid).set({name,email,createdAt:fsNow(),lastActive:fsNow()},{merge:true}).catch(()=>{});
    }else await auth.signInWithEmailAndPassword(email,pass);
  }catch(err){ACCT.err=authErr(err);}
  ACCT.busy=false;renderAccount();renderStats();
}
function esc(t){return String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}


function renderOppBtn(){
  const cnt={};for(const k of SETTINGS.styles)cnt[k]=(cnt[k]||0)+1;
  const pre=STYLE_PRESETS.find(([,a])=>a.join()===SETTINGS.styles.join());
  $('#oppBtn').textContent=pre?tx(pre[0],PRESET_EN[STYLE_PRESETS.indexOf(pre)]):STYLE_KEYS.filter(k=>cnt[k]).map(k=>`${STYLE_DEF[k].n}×${cnt[k]}`).join(' ');
}
function renderOpp(){
  const el=$('#oppSheet');
  let h=`<button class="x" id="oppClose" aria-label="${tx('关闭','Close')}">×</button><h2 id="oppTitle">${tx('对手类型','Opponent types')}</h2>
  <p class="fine">${tx('从下一手开始生效。GTO 建议和评分不会因为对手类型而改变；翻后胜率会按对手的类型估计他的范围，并给出剥削提示。','Takes effect from the next hand. GTO advice and scoring do not change with opponent type; postflop equity estimates each opponent\'s range by his type and adds exploit tips.')}</p>
  <div class="row presets">${STYLE_PRESETS.map(([n],i)=>`<button class="pre${STYLE_PRESETS[i][1].join()===SETTINGS.styles.join()?' on':''}" data-p="${i}">${tx(n,PRESET_EN[i])}</button>`).join('')}<button class="pre" data-p="rand">${tx('随机','Random')}</button></div>
  <div class="opplist">${(LANG==='en'?NAMES_EN:NAMES).slice(1).map((nm,i)=>`<label for="sty${i}"><span>${nm}</span><select id="sty${i}" data-i="${i}">${STYLE_KEYS.map(k=>`<option value="${k}"${SETTINGS.styles[i]===k?' selected':''}>${cap(STYLE_DEF[k].full)}</option>`).join('')}</select></label>`).join('')}</div>
  <dl class="styd">${STYLE_KEYS.map(k=>`<div><dt><span class="sty sty-${k}">${STYLE_DEF[k].n}</span></dt><dd>${STYLE_DEF[k].d}</dd></div>`).join('')}</dl>`;
  el.innerHTML=h;
  $('#oppClose').onclick=()=>{$('#oppModal').hidden=true;};
  el.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{
    SETTINGS.styles=b.dataset.p==='rand'?SETTINGS.styles.map(()=>STYLE_KEYS[(Math.random()*STYLE_KEYS.length)|0]):STYLE_PRESETS[+b.dataset.p][1].slice();
    save('gto9-settings',SETTINGS);renderOpp();renderOppBtn();});
  el.querySelectorAll('select[data-i]').forEach(sel=>sel.onchange=()=>{SETTINGS.styles[+sel.dataset.i]=sel.value;save('gto9-settings',SETTINGS);renderOpp();renderOppBtn();});
}

function setLang(v){
  LANG=v;try{localStorage.setItem('gto9-lang',v);}catch(e){}
  if(ACCT.fb)ACCT.fb.auth.languageCode=LANG==='en'?'en':LANG==='hk'?'zh_TW':'zh_CN';
  applyLang();renderOppBtn();
  // the advice on screen is rebuilt in the new language; the hand log keeps the language it was written in
  if(P.length&&G.toAct===0&&!G.over){G.cur=computeAdvice(0,3000,true);}
  if(P.length)render();renderAccount();
  if(!$('#oppModal').hidden)renderOpp();
}
function initSettings(){
  const sl=$('#setLang');sl.value=LANG;sl.onchange=()=>setLang(sl.value);applyLang();
  const sp=$('#setPos'),sm=$('#setMode'),ss=$('#setSpeed');
  sp.value=SETTINGS.pos;sm.value=SETTINGS.mode;ss.value=SETTINGS.speed;
  sp.onchange=()=>{SETTINGS.pos=sp.value;save('gto9-settings',SETTINGS);};
  sm.onchange=()=>{SETTINGS.mode=sm.value;save('gto9-settings',SETTINGS);if(G.toAct===0&&!G.over){G.showAdvice=SETTINGS.mode==='live';render();}};
  ss.onchange=()=>{SETTINGS.speed=ss.value;save('gto9-settings',SETTINGS);};
  renderOppBtn();
  $('#oppBtn').onclick=()=>{$('#oppModal').hidden=false;renderOpp();};
  $('#oppModal').addEventListener('click',e=>{if(e.target.id==='oppModal')$('#oppModal').hidden=true;});
  document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#oppModal').hidden=true;});
  let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{if(P.length)renderTable();},80);});
}
initSettings();
initAccount();
newHand();
initVersion();
</script>

<script>
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});}
</script>
