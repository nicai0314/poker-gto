<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">

<meta name="theme-color" content="#0e1318">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">

<body>
<title>德扑 GTO 训练台</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@700;900&display=swap">
<style>
/* Layout: header strip; table + action bar on the left (primary), advice + log column on the right; stacks to one column on phones.
   Colour code follows solver convention: fold = blue, check/call = green, bet/raise = red. */
:root{
  color-scheme:dark;
  --bg:#0e1318; --panel:#151c22; --panel2:#1c252d; --line:#2a353e; --fg:#e8ecea; --muted:#93a0a8; --dim:#62707a;
  --felt:#16513f; --felt2:#0b2e25; --rail:#3b2b21; --rail2:#21170f; --brass:#d6ab52; --brass-soft:rgba(214,171,82,.18);
  --fold:#4d84d6; --call:#35a776; --raise:#de5847;
  --cardbg:#f7f4ec; --cardline:#d9d3c6; --s:#1d2126; --h:#cc3430; --d:#2a6fd0; --c:#1f8a4c;
  --ff-body:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --ff-disp:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  --ff-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--ff-body);font-size:14px;line-height:1.55}
*{box-sizing:border-box}
button,select,input{font:inherit;color:inherit}
.wrap{max-width:1320px;margin:0 auto;padding-block:16px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 24px;justify-content:space-between}
.brand h1{font-family:var(--ff-disp);font-weight:900;font-size:26px;margin:0;letter-spacing:.04em;line-height:1.2}
.brand h1 em{font-style:normal;color:var(--brass)}
.brand p{margin:2px 0 0;color:var(--muted);font-size:13px}
.stats{display:flex;gap:18px;flex-wrap:wrap}
.stat{display:flex;flex-direction:column}
.stat span{font-size:11px;color:var(--muted);letter-spacing:.06em}
.stat b{font-family:var(--ff-num);font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.pos{color:var(--call)} .neg{color:var(--raise)}
.settings{display:flex;flex-wrap:wrap;gap:10px}
.settings label{display:flex;flex-direction:column;font-size:11px;color:var(--muted);gap:3px;letter-spacing:.04em}
.settings select{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-size:13px;color:var(--fg)}
.settings select:focus-visible{outline:2px solid var(--brass);outline-offset:1px}

.main{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);grid-template-rows:auto auto 1fr;grid-template-areas:"table advice" "action advice" "log advice";gap:14px 16px;align-items:start}
#table{grid-area:table}#actionbar{grid-area:action}#advice{grid-area:advice}.logp{grid-area:log}
@media (max-width:940px){.main{grid-template-columns:minmax(0,1fr);grid-template-rows:none;grid-template-areas:"table" "action" "advice" "log"}}

/* table */
.tablebox{position:relative;width:100%;aspect-ratio:16/10.4;max-width:100%}
@media (max-width:600px){.tablebox{aspect-ratio:4/5.2}}
.felt{position:absolute;left:8%;right:8%;top:11%;bottom:12%;border-radius:50%;
  background:radial-gradient(ellipse at 50% 42%,var(--felt) 0%,var(--felt2) 78%);
  border:12px solid var(--rail);box-shadow:inset 0 0 0 2px rgba(0,0,0,.35),inset 0 10px 40px rgba(0,0,0,.45),0 0 0 2px var(--rail2),0 18px 40px rgba(0,0,0,.45)}
@media (max-width:600px){.felt{left:7%;right:7%;top:12%;bottom:13%;border-width:9px;border-radius:46%}}
.felt::after{content:"";position:absolute;inset:9%;border-radius:50%;border:1px solid rgba(214,171,82,.16);pointer-events:none}
.center{position:absolute;left:50%;top:47%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:8px;z-index:1}
.board{display:flex;gap:5px}
.slot{width:44px;height:62px;border-radius:6px;border:1px dashed rgba(255,255,255,.14)}
.potline{font-size:13px;color:#d9e6df;background:rgba(0,0,0,.32);padding:2px 12px;border-radius:999px;white-space:nowrap}
.potline b{font-family:var(--ff-num);color:var(--brass);font-weight:600}
.street{font-size:11px;letter-spacing:.12em;color:rgba(232,236,234,.55)}

.seat{position:absolute;transform:translate(-50%,-50%);width:108px;display:flex;flex-direction:column;align-items:center;gap:3px;z-index:2;transition:opacity .2s}
.seat.me{width:130px}
.seat .hole{display:flex;gap:3px;min-height:31px;align-items:flex-end}
.plate{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:2px 8px;width:100%;display:flex;justify-content:space-between;align-items:baseline;gap:6px;font-size:12px;white-space:nowrap}
.plate .nm{overflow:hidden;text-overflow:ellipsis}
.plate .ps{font-family:var(--ff-num);font-size:11px;color:var(--brass);font-weight:600}
.stk{font-family:var(--ff-num);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;line-height:1.2}
.tag{font-size:11px;line-height:1.5;padding:0 8px;border-radius:999px;background:rgba(0,0,0,.45);color:var(--fg);white-space:nowrap;max-width:140px;overflow:hidden;text-overflow:ellipsis}
.tag.t-fold{color:#9dbbe8}.tag.t-call{color:#8fdcb6}.tag.t-raise{color:#f5a196}.tag.t-win{background:var(--call);color:#06150e;font-weight:700}
.seat.me .plate{background:#24313b;border-color:#3a4955}
.seat.turn .plate{border-color:var(--brass);box-shadow:0 0 0 3px var(--brass-soft)}
.seat.out{opacity:.42}
.seat.win .plate{border-color:var(--call)}
@media (max-width:600px){
  .seat{width:78px}.seat.me{width:112px}
  .plate{padding:1px 5px;font-size:11px}.plate .ps{font-size:10px}
  .stk{font-size:11px}.tag{font-size:10px;padding:0 6px;max-width:92px}
  .slot{width:34px;height:48px}
  .board{gap:4px}
}
.chip{position:absolute;transform:translate(-50%,-50%);font-family:var(--ff-num);font-size:12px;font-weight:600;color:#1a1408;background:var(--brass);padding:0 7px;border-radius:999px;box-shadow:0 2px 0 rgba(0,0,0,.35);z-index:1;white-space:nowrap}
.dealer{position:absolute;transform:translate(-50%,-50%);width:22px;height:22px;border-radius:50%;background:#f1ece0;color:#1b1b1b;font-weight:700;font-size:12px;display:grid;place-items:center;box-shadow:0 2px 0 rgba(0,0,0,.4);z-index:1}

/* cards */
.card{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;background:var(--cardbg);border:1px solid var(--cardline);border-radius:6px;font-family:var(--ff-num);font-weight:600;line-height:1;box-shadow:0 2px 3px rgba(0,0,0,.35);flex:none}
.card b{font-weight:600}.card i{font-style:normal}
.card.md{width:44px;height:62px;font-size:19px;gap:3px}.card.md i{font-size:18px}
.card.lg{width:44px;height:62px;font-size:19px;gap:3px}.card.lg i{font-size:18px}
.card.sm{width:23px;height:32px;font-size:11px;border-radius:4px;gap:1px}.card.sm i{font-size:10px}
.card.xs{width:20px;height:27px;font-size:10px;border-radius:3px;gap:0;vertical-align:middle;box-shadow:none}.card.xs i{font-size:9px}
.card.s-s{color:var(--s)}.card.s-h{color:var(--h)}.card.s-d{color:var(--d)}.card.s-c{color:var(--c)}
.card.back{background:repeating-linear-gradient(45deg,#7d2a26 0 4px,#93352f 4px 8px);border:2px solid #f1ece0}
@media (max-width:600px){.card.md,.card.lg{width:34px;height:48px;font-size:15px}.card.md i,.card.lg i{font-size:14px}.card.sm{width:18px;height:26px;font-size:9px}.card.sm i{font-size:8px}}

/* action bar */
.actionbar{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;min-height:64px}
.info{display:flex;flex-wrap:wrap;gap:4px 16px;color:var(--muted);font-size:13px}
.info b{font-family:var(--ff-num);color:var(--fg);font-weight:600}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:0;border-radius:9px;padding:9px 16px;font-weight:700;font-size:15px;cursor:pointer;min-width:84px;transition:transform .06s,filter .15s}
.btn:hover{filter:brightness(1.1)}.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.btn.fold{background:var(--fold);color:#fff}.btn.call{background:var(--call);color:#04140c}.btn.raise{background:var(--raise);color:#fff}
.btn.primary{background:var(--brass);color:#1a1408}.btn.ghost{background:var(--panel2);border:1px solid var(--line);color:var(--fg);font-weight:500}
.sizer{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.pre{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:3px 11px;font-size:12px;cursor:pointer;color:var(--fg)}
.pre.on{border-color:var(--raise);color:#f5a196}
.pre.rec{box-shadow:inset 0 0 0 1px var(--brass)}
.sizer input[type=range]{flex:1 1 140px;min-width:0;accent-color:var(--raise)}
.sizer input[type=number]{width:78px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:4px 6px;font-family:var(--ff-num)}
.wait{color:var(--muted)}
.res{font-size:16px}.res b{font-family:var(--ff-num);font-size:20px}

/* panels */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.panel h2{margin:0;font-size:15px;font-family:var(--ff-disp);font-weight:700;display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;letter-spacing:.03em}
.kind{font-family:var(--ff-body);font-size:11px;font-weight:500;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:0 8px;letter-spacing:.02em}
.sit{margin:0;color:#cfd8d3}
.fbar{display:flex;height:14px;border-radius:4px;overflow:hidden;background:var(--panel2)}
.fbar span{display:block;height:100%}
.f-fold{background:var(--fold)}.f-check,.f-call{background:var(--call)}.f-bet,.f-raise{background:var(--raise)}
.opts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.opts li{display:grid;grid-template-columns:12px 1fr auto;gap:8px;align-items:center;font-size:14px}
.opts li .sw{width:12px;height:12px;border-radius:3px}
.opts li b{font-family:var(--ff-num);font-weight:600;font-variant-numeric:tabular-nums}
.opts li.top span{font-weight:700}
.opts li.zero{color:var(--dim)}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
@media (max-width:420px){.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kv{background:var(--panel2);border-radius:8px;padding:6px 8px}
.kv span{display:block;font-size:11px;color:var(--muted)}
.kv b{font-family:var(--ff-num);font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
.line{font-size:13px;color:#cfd8d3}
.line .lbl{color:var(--muted)}
.why{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:13px;color:#d6ddd9}
.fb{border-radius:9px;padding:8px 10px;font-size:13px;background:var(--panel2);border-left:3px solid var(--dim)}
.fb .badge{font-weight:700;margin-right:6px}
.fb.lv-best{border-left-color:var(--call)}.fb.lv-best .badge{color:var(--call)}
.fb.lv-ok{border-left-color:var(--brass)}.fb.lv-ok .badge{color:var(--brass)}
.fb.lv-meh{border-left-color:#e08a3a}.fb.lv-meh .badge{color:#e08a3a}
.fb.lv-bad{border-left-color:var(--raise)}.fb.lv-bad .badge{color:var(--raise)}
.quiz{display:flex;flex-direction:column;gap:8px;align-items:flex-start;color:var(--muted)}
.dist{display:flex;flex-direction:column;gap:5px}
.dist .bar{display:flex;height:10px;border-radius:3px;overflow:hidden;background:var(--panel2)}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.b-strong{background:#de5847}.b-good{background:#e8954a}.b-medium{background:#d6ab52}.b-draw{background:#8c6fd6}.b-weak{background:#4f9a86}.b-air{background:#4a5863}

.mxwrap{overflow-x:auto}
.mx{display:grid;grid-template-columns:repeat(13,minmax(20px,1fr));gap:1px;min-width:280px}
.mx div{aspect-ratio:1;display:grid;place-items:center;font-size:9px;font-family:var(--ff-num);color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.6);border-radius:2px;letter-spacing:-.02em}
.mx div.hero{outline:2px solid #fff;outline-offset:-1px;z-index:1;position:relative}
.sep{height:1px;background:var(--line)}
table.rev{width:100%;border-collapse:collapse;font-size:12.5px}
.revwrap{overflow-x:auto}
table.rev th{text-align:left;color:var(--muted);font-weight:500;padding:4px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
table.rev td{padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.rv{font-weight:700;white-space:nowrap}.rv.lv-best{color:var(--call)}.rv.lv-ok{color:var(--brass)}.rv.lv-meh{color:#e08a3a}.rv.lv-bad{color:var(--raise)}
.sd{display:flex;flex-direction:column;gap:5px}
.sd div{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px}
.sd .w{color:var(--call);font-weight:700}
.empty{color:var(--muted);font-size:13px;margin:0}

#log{list-style:none;margin:0;padding:0;max-height:240px;overflow-y:auto;font-size:12.5px;display:flex;flex-direction:column;gap:2px}
#log li{color:#c8d1cc}
#log li.st{color:var(--brass);margin-top:4px}
#log li.hd{color:var(--fg);font-weight:700;border-top:1px solid var(--line);padding-top:6px;margin-top:6px}
#log li.hd:first-child{border-top:0;margin-top:0;padding-top:0}
.note{color:var(--dim);font-size:12px;margin:0;max-width:80ch}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>德扑 <em>GTO</em> 训练台</h1>
      <p>九人桌 · 每手 100bb · 你对 8 个 AI，每一步给出 GTO 建议</p>
    </div>
    <div class="stats" id="stats"></div>
    <div class="settings">
      <label for="setPos">我的位置
        <select id="setPos">
          <option value="rot">每手轮转</option>
          <option value="0">固定 UTG</option><option value="1">固定 UTG+1</option><option value="2">固定 UTG+2</option>
          <option value="3">固定 LJ</option><option value="4">固定 HJ</option><option value="5">固定 CO</option>
          <option value="6">固定 BTN</option><option value="7">固定 SB</option><option value="8">固定 BB</option>
        </select>
      </label>
      <label for="setMode">建议显示
        <select id="setMode"><option value="live">实时显示</option><option value="quiz">先决定，后显示</option></select>
      </label>
      <label for="setSpeed">AI 速度
        <select id="setSpeed"><option value="slow">慢</option><option value="normal">中</option><option value="fast">快</option></select>
      </label>
    </div>
  </header>

  <main class="main">
    <div class="tablebox" id="table" aria-label="牌桌"></div>
    <div class="actionbar" id="actionbar"></div>
    <section class="panel" id="advice"></section>
    <section class="panel logp"><h2>牌局记录</h2><ol id="log"></ol></section>
  </main>
  <p class="note">翻前建议基于九人桌 100bb 求解器范围的近似（小盲简化为加注或弃牌）。翻后建议用你对“对手估计范围”的胜率、底池赔率、MDF 和牌面结构推算，属于求解器思路的近似，不是逐点求解的结果。AI 对手按同一套策略带随机混合行动。</p>
</div>

<script>
'use strict';
/* ================= constants ================= */
const RANK_CH='23456789TJQKA', DESC='AKQJT98765432';
const SUIT_SYM=['♠','♥','♦','♣'], SUIT_CLS=['s','h','d','c'];
const BB=10, START=100*BB;
const POS_NAMES=['UTG','UTG+1','UTG+2','LJ','HJ','CO','BTN','SB','BB'];
const POS_CN=['枪口','枪口+1','中位','低位','劫位','关煞','庄位','小盲','大盲'];
const OFF2POS=[6,7,8,0,1,2,3,4,5]; // seats after the button -> position index
const NAMES=['你','阿杰','老王','小林','明哥','小雨','阿强','阿伦','小周'];
const SPEED={slow:1000,normal:600,fast:250};
const STREET_CN=['翻前','翻牌','转牌','河牌'];

/* ================= evaluator ================= */
const STR=new Int8Array(8192);
for(let m=0;m<8192;m++){let s=-1;for(let h=12;h>=4;h--){const need=0x1F<<(h-4);if((m&need)===need){s=h;break;}}if(s<0&&(m&0x100F)===0x100F)s=3;STR[m]=s;}
const _cnt=new Int8Array(13),_sm=new Int32Array(4),_sc=new Int8Array(4);
function kick(mask,n,shift){let v=0;for(let r=12;r>=0&&n>0;r--){if(mask>>r&1){v|=r<<shift;shift-=4;n--;}}return v;}
function evalHand(cs){
  _cnt.fill(0);_sm.fill(0);_sc.fill(0);let mask=0;
  for(let i=0;i<cs.length;i++){const c=cs[i],r=c>>2,s=c&3;_cnt[r]++;mask|=1<<r;_sm[s]|=1<<r;_sc[s]++;}
  let fs=-1;for(let s=0;s<4;s++)if(_sc[s]>=5)fs=s;
  if(fs>=0){const sh=STR[_sm[fs]];if(sh>=0)return(8<<20)|(sh<<16);}
  let q=-1,t1=-1,t2=-1,p1=-1,p2=-1;
  for(let r=12;r>=0;r--){const c=_cnt[r];if(c===4)q=r;else if(c===3){if(t1<0)t1=r;else if(t2<0)t2=r;}else if(c===2){if(p1<0)p1=r;else if(p2<0)p2=r;}}
  if(q>=0)return(7<<20)|(q<<16)|kick(mask&~(1<<q),1,12);
  if(t1>=0&&(t2>=0||p1>=0))return(6<<20)|(t1<<16)|(Math.max(t2,p1)<<12);
  if(fs>=0)return(5<<20)|kick(_sm[fs],5,16);
  const sh=STR[mask];if(sh>=0)return(4<<20)|(sh<<16);
  if(t1>=0)return(3<<20)|(t1<<16)|kick(mask&~(1<<t1),2,12);
  if(p2>=0)return(2<<20)|(p1<<16)|(p2<<12)|kick(mask&~(1<<p1)&~(1<<p2),1,8);
  if(p1>=0)return(1<<20)|(p1<<16)|kick(mask&~(1<<p1),3,12);
  return kick(mask,5,16);
}
function rankCN(r){return r===8?'10':RANK_CH[r];}
function handName(v){const c=v>>20,a=(v>>16)&15,b=(v>>12)&15;
  switch(c){case 8:return a===12?'皇家同花顺':`同花顺（${rankCN(a)} 高）`;case 7:return `四条 ${rankCN(a)}`;case 6:return `葫芦（${rankCN(a)} 带 ${rankCN(b)}）`;
  case 5:return `同花（${rankCN(a)} 高）`;case 4:return `顺子（${rankCN(a)} 高）`;case 3:return `三条 ${rankCN(a)}`;case 2:return `两对 ${rankCN(a)} 和 ${rankCN(b)}`;
  case 1:return `一对 ${rankCN(a)}`;default:return `高牌 ${rankCN(a)}`;}}

/* ================= ranges ================= */
function di(ch){return DESC.indexOf(ch);}
function clsOf(c1,c2){const a=12-(c1>>2),b=12-(c2>>2);if(a===b)return a*13+a;const hi=Math.min(a,b),lo=Math.max(a,b);return (c1&3)===(c2&3)?hi*13+lo:lo*13+hi;}

function classify(h1,h2,B){
  const r1=h1>>2,r2=h2>>2;const all=[h1,h2].concat(B);const v=evalHand(all),cat=v>>20;
  const bv=evalHand(B),bcat=bv>>20;

      if(pr>br[0]){b='good';d=`超对（${rankCN(pr)}${rankCN(pr)}）`;}
      else if(br.length>1&&pr>br[1]){b='medium';d=`口袋对 ${rankCN(pr)}${rankCN(pr)}（低于顶张）`;}
      else{b='weak';d=`小口袋对 ${rankCN(pr)}${rankCN(pr)}`;}
    }else{
      const k=pr===r1?r2:r1;

      else if(pr===br[1]){b='medium';d=`中对（${rankCN(pr)}）`;}
      else{b='weak';d=`底对（${rankCN(pr)}）`;}

    for(let s=0;s<4;s++){const hs=((h1&3)===s?1:0)+((h2&3)===s?1:0);if(!hs)continue;let bs=0;for(const c of B)if((c&3)===s)bs++;if(hs+bs===4){fd=true;if(((h1&3)===s&&r1===12)||((h2&3)===s&&r2===12))nut=true;}}

/* ================= equity (Monte Carlo vs weighted ranges) ================= */
const _used=new Uint32Array(52);let _stamp=1;
function randFree(){let c;do{c=(Math.random()*52)|0;}while(_used[c]===_stamp);return c;}
function equityMC(hole,board,ranges,iters){
  const dead=new Set(hole.concat(board));
  const opps=ranges.map(cs=>{const arr=[],cum=[];let tot=0;if(cs)for(const c of cs){if(c[2]<=0||dead.has(c[0])||dead.has(c[1]))continue;tot+=c[2];arr.push(c);cum.push(tot);}return{arr,cum,tot};});
  const hand=new Array(7),bd=new Array(5),oc=[];let win=0;
  for(let it=0;it<iters;it++){
    _stamp++;if(_stamp>4e9){_used.fill(0);_stamp=1;}
    for(const c of hole)_used[c]=_stamp;for(const c of board)_used[c]=_stamp;
    oc.length=0;
    for(const o of opps){
      let a=-1,b=-1;
      if(o.tot>0){for(let t=0;t<6;t++){const x=Math.random()*o.tot;let lo=0,hi=o.cum.length-1;while(lo<hi){const mid=(lo+hi)>>1;if(o.cum[mid]>x)hi=mid;else lo=mid+1;}const cm=o.arr[lo];if(_used[cm[0]]!==_stamp&&_used[cm[1]]!==_stamp){a=cm[0];b=cm[1];break;}}}
      if(a<0){a=randFree();_used[a]=_stamp;b=randFree();}
      _used[a]=_stamp;_used[b]=_stamp;oc.push(a,b);
    }
    for(let i=0;i<board.length;i++)bd[i]=board[i];
    for(let i=board.length;i<5;i++){const c=randFree();_used[c]=_stamp;bd[i]=c;}
    for(let i=0;i<5;i++)hand[i+2]=bd[i];
    hand[0]=hole[0];hand[1]=hole[1];const hv=evalHand(hand);let ties=0,lose=false;
    for(let k=0;k<oc.length;k+=2){hand[0]=oc[k];hand[1]=oc[k+1];const v=evalHand(hand);if(v>hv){lose=true;break;}if(v===hv)ties++;}
    if(!lose)win+=1/(ties+1);
  }
  return win/iters;
}
function buildCombos(w,isUser){
  const out=[];
  for(let a=0;a<52;a++)for(let b=a+1;b<52;b++){const x=w[clsOf(a,b)];if(x>0.0005)out.push([a,b,x]);}
  if(!out.length){for(let a=0;a<52;a++)for(let b=a+1;b<52;b++)out.push([a,b,1]);}
  return out;
}

function pfContext(pi){
  const p=P[pi],pos=p.pos,lvl=G.raiseLevel,toCall=G.currentBet-p.bet;
  if(lvl>=1&&toCall>0&&G.currentBet>=0.35*START)return{kind:'jam',tbl:T.VS5};
  if(lvl===0){
    if(G.limpers.length===0)return{kind:'rfi',tbl:T.RFI[pos]};
    if(pos===8)return{kind:'limpBB',tbl:T.LIMP_BB};
    if(pos===7)return{kind:'limpSB',tbl:T.LIMP_SB};
    return{kind:'iso',tbl:{r:T.RFI[Math.max(0,pos-2)].r,c:EMPTY}};
  }
  if(lvl===1){const op=P[G.raisers[0]];const tier=tierOf(op.pos),type=pos===8?'bb':pos===7?'sb':'ip';return{kind:'vsOpen',tier,type,op:op.i,tbl:T.VS_OPEN[type][tier]};}

  if(lvl===3){if(G.raisers[1]===pi)return{kind:'vs4',tbl:T.VS4};return{kind:'vs4c',tbl:T.VS4C};}

}
function pfRaiseTo(pi,ctx){
  const p=P[pi],max=p.stack+p.bet,cb=G.currentBet;let to;
  switch(ctx.kind){
    case 'rfi':to=p.pos===7?30:25;break;
    case 'iso':case 'limpSB':case 'limpBB':to=30+G.limpers.length*BB+(p.pos>=7?5:0);break;
    case 'vsOpen':to=(p.pos>=7?4:3)*cb+G.callers*cb;break;
    case 'vs3o':case 'vs3c':to=cb*2.3;break;
    default:to=max;
  }
  to=round5(to);if(to>=max*0.4)to=max;to=Math.max(to,cb+G.minRaise);return Math.min(to,max);

function preReasons(ctx,k,fr,rp,cp,p){
  const out=[],nm=clsName(k),PN=POS_NAMES[p.pos];
  const verdict=fr.raise>=0.95?'是纯加注':fr.raise>=0.05&&fr.call>=0.05?'在加注和跟注之间混合':fr.raise>=0.05?'是混合加注（一部分频率加注，其余弃牌）':fr.call>=0.95?(G.currentBet>p.bet?'是纯跟注':'直接过牌'):fr.call>=0.05?'是混合跟注':'不在继续范围内，弃牌';
  switch(ctx.kind){
    case 'rfi':
      out.push(`${PN} 开池范围约 ${rp}%。${nm} ${verdict}。`);
      if(p.pos<=2)out.push('前位后面还有很多人没行动，有人拿到大牌的概率高，范围必须紧。');
      else if(p.pos>=5&&p.pos<=6)out.push('后位后面只剩少数人，而且翻后大多有位置，可以开得更宽。');
      if(p.pos===7)out.push('简化：小盲按“加注或弃牌”处理，真实求解器里小盲会有一部分平跟。');
      break;
    case 'iso':case 'limpSB':case 'limpBB':
      out.push(`有人溜入时，用比正常开池稍紧的范围加注隔离，尺度约 3bb + 每个溜入者 1bb。${nm} ${verdict}。`);
      if(ctx.kind==='limpBB')out.push('大盲可以免费看翻牌，不值得加注的牌直接过牌。');
      out.push('GTO 打法里几乎不主动溜入，溜入范围很容易被剥削。');
      break;
    case 'vsOpen':{
      const op=P[ctx.op];
      out.push(`面对 ${POS_NAMES[op.pos]} 开池：3bet 约 ${rp}%，跟注约 ${cp}%。${nm} ${verdict}。`);
      if(ctx.tier===0)out.push('前位开池的范围很强，你继续的范围也要相应收紧。');
      if(ctx.type==='bb')out.push('大盲已投入 1bb，跟注价格便宜，所以防守范围最宽。');
      if(ctx.type==='sb')out.push('小盲翻后没有位置，后面还有大盲，以 3bet 或弃牌为主，很少平跟。');
      if(ctx.type==='ip'&&G.callers>0)out.push(`已经有 ${G.callers} 人跟注，3bet 尺度要相应加大。`);
      break;}
    case 'vs3o':out.push(`你开池后被 3bet：4bet 约 ${rp}%，跟注约 ${cp}%。${nm} ${verdict}。`);out.push('被 3bet 后，大部分边缘开池牌要放弃，否则会被对手剥削。');break;
    case 'vs3c':out.push(`前面已经有加注和 3bet，冷跟和冷 4bet 的范围非常窄（合计约 ${Math.round((rp+cp)*10)/10}%）。${nm} ${verdict}。`);break;
    case 'vs4':out.push(`你的 3bet 遭遇 4bet：全下约 ${rp}%，跟注约 ${cp}%。${nm} ${verdict}。`);break;
    default:out.push(`面对全下级别的加注，只用最强的牌继续（约 ${Math.round((rp+cp)*10)/10}%）。${nm} ${verdict}。`);
  }
  if(/^A[2-5]s$/.test(nm)&&fr.raise>0&&ctx.kind!=='rfi')out.push(`${nm} 常用作诈唬加注：手里的 A 降低对手拿到 AA/AK 的概率，还能做成同花或顺子。`);
  return out;
}
function advisePre(pi){
  const p=P[pi],ctx=pfContext(pi),k=clsOf(p.hole[0],p.hole[1]);
  const toCall=Math.min(G.currentBet-p.bet,p.stack),max=p.stack+p.bet;
  const others=P.some(q=>q!==p&&!q.folded&&!q.allIn);
  const canRaise=p.stack>toCall&&others&&G.currentBet<max;
  const m={check:toCall===0,noRaise:!canRaise};
  const fr=mergedFreq(ctx.tbl,k,m);
  const opts=[];
  if(toCall>0)opts.push({t:'fold',f:fr.fold,label:'弃牌'});
  opts.push(toCall>0?{t:'call',f:fr.call,amt:toCall,label:p.stack<=toCall?`跟注全下 ${fmt(toCall)}`:`跟注 ${fmt(toCall)}`}:{t:'check',f:fr.call,label:'过牌'});
  if(canRaise){const to=pfRaiseTo(pi,ctx);opts.push({t:'raise',f:fr.raise,to,label:to===max?`全下 ${fmt(to)}`:`加注到 ${fmt(to)}`});}
  let rp=0,cp=0;const mat=new Array(169);
  for(let j=0;j<169;j++){const x=mergedFreq(ctx.tbl,j,m);mat[j]=x;rp+=clsCombos(j)*x.raise;cp+=clsCombos(j)*(toCall>0?x.call:0);}
  rp=Math.round(rp/1326*1000)/10;cp=Math.round(cp/1326*1000)/10;
  return{street:0,pre:{tbl:ctx.tbl,m},ctx,k,opts,mat,rp,cp,sit:sitText(ctx,p),reasons:pi===0?preReasons(ctx,k,fr,rp,cp,p):[]};
}

function advisePost(pi,iters,detail){
  const p=P[pi],B=G.board,opps=P.filter(q=>q!==p&&!q.folded),n=opps.length;
  const eq=equityMC(p.hole,B,opps.map(q=>q.combos),iters);
  const pot=potTotal(),toCall=Math.min(G.currentBet-p.bet,p.stack),max=p.stack+p.bet;
  const cl=classify(p.hole[0],p.hole[1],B),tex=texture(B),street=G.street,river=street===3;
  const ip=isIP(pi),agg=G.aggr[street-1]===pi;
  const eff=Math.min(p.stack,Math.max(0,...opps.map(q=>q.stack)));
  const spr=pot>0?eff/pot:0;
  const others=opps.some(q=>!q.allIn);
  const why=[];let o,opts,potOdds=null,mdf=null;
  if(toCall===0){
    let frac=river?0.75:(tex.wet?0.66:0.33);if(n>=2)frac=tex.wet?0.5:0.33;
    const vT=n===1?0.6:n===2?0.45:0.36,sT=vT+0.17;
    if(eq>=sT){if(!river&&tex.wet)frac=Math.max(frac,0.66);o={bet:.85,check:.15};why.push('胜率很高，主要用价值下注，从对手更差的牌里拿钱。');if(!tex.wet&&!river)why.push('干燥牌面可以偶尔过牌慢打，平衡你的过牌范围。');}
    else if(eq>=vT){o={bet:.6,check:.4};why.push('牌力领先但不算坚果，以薄价值下注为主，也可以过牌控池。');}
    else if(eq>=vT-0.18){
      if(agg&&street===1&&n===1&&!tex.wet){frac=0.33;o={bet:.55,check:.45};why.push('你是翻前进攻者，干燥牌面你的范围更强，可以小注高频持续下注。');}
      else{o={check:.8,bet:.2};why.push('中等牌力，有摊牌价值，以过牌控制底池为主。');}
    }else{
      const b=cl.b;
      if(!river&&b==='strongdraw'){o={bet:.7,check:.3};why.push('强听牌适合半诈唬下注：现在能让对手弃牌，被跟注后还有很多补牌。');}
      else if(!river&&b==='draw'){o={bet:.5,check:.5};why.push('有像样的听牌，半诈唬下注和过牌免费看牌都可以。');}
      else if(!river&&b==='weakdraw'){o={check:.7,bet:.3};why.push('只有卡顺这类弱听牌，偶尔诈唬，多数时候过牌。');}
      else if(agg&&n===1&&street===1&&!tex.wet){frac=0.33;o={bet:.45,check:.55};why.push('牌很弱，但作为翻前进攻者在干燥牌面可以小注做范围性持续下注，对手会弃掉很多牌。');}
      else if(river&&agg&&n===1){o={check:.75,bet:.25};why.push(`没有摊牌价值，可以用少部分牌诈唬。下注 ${Math.round(frac*100)}% 底池时，诈唬占下注范围约 ${Math.round(frac/(1+2*frac)*100)}% 能让对手无论跟不跟都不占便宜。`);}
      else{o=n>=2?{check:1}:{check:.9,bet:.1};why.push(n>=2?'多人底池里弱牌诈唬很难成功，应该过牌。':'牌力弱、也没有主动权，以过牌为主。');}
    }
    const prevAgg=G.aggr[street-1]>=0?P[G.aggr[street-1]]:null;
    if(prevAgg&&prevAgg!==p&&!prevAgg.folded&&!prevAgg.allIn&&order(prevAgg.i)>order(pi)&&G.nb===0){
      const keep=eq>=sT?0.45:0.25;o={bet:(o.bet||0)*keep};o.check=1-o.bet;
      why.push(`上一条街的进攻者 ${who(prevAgg)} 还在你后面行动。没有主动权时，GTO 通常先过牌给进攻者，很少领先下注（donk）。`);
    }
    let to=round5(frac*pot);to=Math.max(to,BB);if(to>=0.7*max)to=max;
    if(spr<1.2&&eq>=vT){to=max;why.push('SPR 很低，有价值时直接全下即可。');}
    opts=[{t:'check',f:o.check||0,label:'过牌'}];
    if(others)opts.push({t:'bet',f:o.bet||0,to,label:to===max?`全下 ${fmt(to)}`:`下注 ${fmt(to)}（${Math.round(to/pot*100)}% 底池）`});
    else opts[0].f=1;
  }else{
    potOdds=toCall/(pot+toCall);mdf=Math.max(0,(pot-toCall)/pot);
    const Rf=(ip?1:0.92)*(n>=2?0.95:1);
    const drawy=!river&&(cl.b==='draw'||cl.b==='strongdraw');
    const effEq=eq*Rf+(drawy&&spr>3?0.05:0);
    const rT=n===1?(river?0.8:0.72):n===2?0.58:0.48;
    const canRaise=p.stack>toCall&&others;
    if(effEq>=rT&&canRaise){o={raise:.65,call:.35};why.push('对估计范围的胜率很高，加注拿价值，同时保护手牌。');}
    else if(effEq>=potOdds+0.07){
      if(!river&&cl.b==='strongdraw'&&canRaise){o={call:.7,raise:.3};why.push('强听牌可以偶尔半诈唬加注。');}else o={call:1};
      why.push(`胜率 ${pc(eq)} 明显高于跟注所需的 ${pc(potOdds)}，跟注长期赚钱。`);
    }else if(effEq>=potOdds-0.03){o={call:.5,fold:.5};why.push(`胜率 ${pc(eq)} 和所需的 ${pc(potOdds)} 很接近，属于边缘牌，跟注和弃牌混合。`);}
    else{o={fold:1};why.push(`胜率 ${pc(eq)} 低于跟注所需的 ${pc(potOdds)}，长期跟注会亏。`);}
    if(drawy)why.push('听牌有隐含赔率：中牌后还能赢到后面的下注，所以跟注门槛略低。');
    if(!ip&&n===1)why.push('你没有位置，后面街更难实现胜率，所以门槛稍微提高。');
    why.push(`MDF ${pc(mdf)}：你的整体范围大约要继续这么多，否则对手用任何两张牌诈唬都能赚钱。`);
    let rt=round5(Math.max(G.currentBet*3,G.currentBet+G.minRaise));if(rt>=0.6*max)rt=max;
    opts=[{t:'fold',f:o.fold||0,label:'弃牌'},{t:'call',f:o.call||0,amt:toCall,label:p.stack<=toCall?`跟注全下 ${fmt(toCall)}`:`跟注 ${fmt(toCall)}`}];
    if(canRaise)opts.push({t:'raise',f:o.raise||0,to:rt,label:rt===max?`全下 ${fmt(rt)}`:`加注到 ${fmt(rt)}`});
    else{opts[1].f+=(o.raise||0);}
  }
  const s=opts.reduce((a,x)=>a+x.f,0)||1;opts.forEach(x=>x.f/=s);
  const res={street,opts,eq,potOdds,mdf,spr,cl,tex,reasons:why,n};
  if(detail){
    res.made=handName(evalHand(p.hole.concat(B)));
    const bettor=G.aggr[street]>=0&&G.aggr[street]!==pi?P[G.aggr[street]]:null;
    const main=bettor&&!bettor.folded?bettor:(opps.find(q=>q.i===G.aggr[street-1])||opps[0]);
    res.mainOpp=main;res.dist=rangeDist(main,p.hole.concat(B));
    res.sit=`${STREET_CN[street]} · ${n+1} 人底池 · ${toCall>0?`${who(bettor||main)} ${G.nb>1?'加注到':'下注'} ${fmt(G.currentBet)}bb，你需要跟 ${fmt(toCall)}bb`:'目前无人下注'} · ${ip?'你有位置':'你没有位置'}`;
  }
  return res;
}
function rangeDist(q,dead){
  const ds=new Set(dead),acc={strong:0,good:0,medium:0,draw:0,weak:0,air:0};let tot=0;
  if(!q||!q.combos)return null;
  for(const c of q.combos){if(c[2]<=0||ds.has(c[0])||ds.has(c[1]))continue;const b=bucketGroup(classify(c[0],c[1],G.board).b);acc[b]+=c[2];tot+=c[2];}
  if(tot<=0)return null;for(const k in acc)acc[k]/=tot;return acc;
}
function computeAdvice(pi,iters,detail){return G.street===0?advisePre(pi):advisePost(pi,iters,detail);}

/* ================= actions ================= */
function act(pi,t,to){
  const p=P[pi];let txt='';
  if(t==='fold'){p.folded=true;txt='弃牌';p.lastT='fold';}
  else if(t==='check'){txt='过牌';p.lastT='call';}
  else if(t==='call'){
    const amt=Math.min(G.currentBet-p.bet,p.stack);put(p,amt);p.lastT='call';
    txt=p.allIn?`跟注全下 ${fmt(amt)}`:`跟注 ${fmt(amt)}`;
    if(G.street===0){if(G.raiseLevel===0)G.limpers.push(pi);else G.callers++;}
  }else{
    const max=p.stack+p.bet;to=Math.min(Math.max(to,Math.min(G.currentBet+G.minRaise,max)),max);
    const inc=to-G.currentBet,wasBet=G.currentBet===0;
    if(inc>=G.minRaise)G.minRaise=inc;
    put(p,to-p.bet);
    if(to>G.currentBet){G.currentBet=to;for(const q of P)if(q!==p&&!q.folded&&!q.allIn)q.acted=false;}
    if(G.street===0){G.raiseLevel++;G.raisers.push(pi);G.callers=0;}
    G.aggr[G.street]=pi;G.nb++;p.lastT='raise';
    txt=p.allIn?`全下 ${fmt(to)}`:wasBet?`下注 ${fmt(to)}`:`加注到 ${fmt(to)}`;
  }
  p.acted=true;p.last=txt;
  log(`${who(p)}：${txt}`);
}
function pfUpdate(p,adv,t){
  if(t==='fold'||!adv.pre)return;
  const key=(t==='check'||t==='call')?'call':'raise';
  for(let k=0;k<169;k++){const f=mergedFreq(adv.pre.tbl,k,adv.pre.m)[key];p.pfW[k]*=p.isUser?Math.max(f,0.03):f;}
}
function narrow(p,t){
  const tb=(t==='bet'||t==='raise')?AGG:t==='call'?CALLM:CHECKM;const B=G.board;
  for(const c of p.combos){if(c[2]<=0)continue;if(B.includes(c[0])||B.includes(c[1])){c[2]=0;continue;}c[2]*=tb[classify(c[0],c[1],B).b];}
}
function commit(pi,adv,t,to){
  const p=P[pi];
  if(G.street===0)pfUpdate(p,adv,t);
  act(pi,t,to);
  if(G.street>0&&t!=='fold')narrow(p,t==='check'?'check':t);
  afterAction(pi);
}
function sample(opts){let x=Math.random(),acc=0;for(const o of opts){acc+=o.f;if(x<acc)return o;}return opts.reduce((a,b)=>b.f>a.f?b:a);}
function botMove(pi){
  if(G.over||G.toAct!==pi)return;
  const adv=computeAdvice(pi,450,false);const o=sample(adv.opts);
  commit(pi,adv,o.t,o.to);
}
function afterAction(pi){
  const alive=P.filter(q=>!q.folded);
  if(alive.length===1)return finishByFold(alive[0]);
  const n=nextNeeding(pi);
  if(n<0)return endStreet();
  G.toAct=n;schedule();
}
function endStreet(){
  for(const q of P)q.bet=0;
  G.currentBet=0;G.minRaise=BB;
  if(G.street===3)return showdown();
  G.street++;
  if(G.street===1){G.deck.pop();G.board.push(G.deck.pop(),G.deck.pop(),G.deck.pop());for(const q of P)if(!q.folded)q.combos=buildCombos(q.pfW,q.isUser);}
  else{G.deck.pop();G.board.push(G.deck.pop());}
  G.nb=0;for(const q of P){q.acted=false;if(!q.folded&&!q.allIn){q.last='';q.lastT='';}}
  log(`${STREET_CN[G.street]}：${G.board.map(cardTxt).join(' ')} · 底池 ${fmt(potTotal())}bb`,'st');
  const canAct=P.filter(q=>!q.folded&&!q.allIn).length;
  if(canAct<=1){G.toAct=-1;render();G.timer=setTimeout(endStreet,G.fast?0:800);return;}
  G.toAct=nextNeeding(G.button);schedule();
}
function showdown(){
  const alive=P.filter(q=>!q.folded),vals={};
  for(const q of alive)vals[q.i]=evalHand(q.hole.concat(G.board));
  const levels=[...new Set(alive.map(q=>q.total))].sort((a,b)=>a-b);
  const won=new Array(9).fill(0);let prev=0,lastW=[];
  for(const L of levels){
    let amt=0;for(const q of P)amt+=Math.max(0,Math.min(q.total,L)-prev);
    const el=alive.filter(q=>q.total>=L);let best=-1;for(const q of el)best=Math.max(best,vals[q.i]);
    const ws=el.filter(q=>vals[q.i]===best);const share=Math.floor(amt/ws.length);let rem=amt-share*ws.length;
    for(const q of ws){won[q.i]+=share+(rem>0?1:0);if(rem>0)rem--;}
    prev=L;lastW=ws;
  }
  let left=0;for(const q of P)left+=Math.max(0,q.total-prev);if(left>0&&lastW.length)won[lastW[0].i]+=left;
  for(const q of P){q.stack+=won[q.i];}
  for(const q of alive){q.last=handName(vals[q.i]);q.lastT=won[q.i]>0?'win':'';}
  G.result={won,vals,showdown:true};
  for(const q of alive)log(`${who(q)} 亮牌 ${q.hole.map(cardTxt).join(' ')} · ${handName(vals[q.i])}${won[q.i]?` · 赢 ${fmt(won[q.i])}bb`:''}`);
  finishHand();
}
function finishByFold(w){
  const pot=potTotal();w.stack+=pot;const won=new Array(9).fill(0);won[w.i]=pot;
  G.result={won,showdown:false};w.last=`赢 ${fmt(pot)}`;w.lastT='win';
  log(`${who(w)} 无人跟注，赢得底池 ${fmt(pot)}bb`);
  finishHand();
}
function finishHand(){
  G.over=true;G.toAct=-1;clearTimeout(G.timer);
  const net=P[0].stack-START;
  STATS.hands++;STATS.net+=net;STATS.dec+=G.decisions.length;STATS.score+=G.decisions.reduce((a,d)=>a+d.rating.score,0);
  save('gto9-stats',STATS);
  log(`本手你${net>0?'赢':net<0?'输':'持平'} ${fmt(Math.abs(net))}bb`);
  render();
}

/* ================= scheduling & user input ================= */
function schedule(){
  if(G.over)return render();
  const p=P[G.toAct];
  if(p.isUser){G.cur=computeAdvice(0,3000,true);G.showAdvice=SETTINGS.mode==='live';G.uiTo=defaultTo();render();return;}
  render();
  G.timer=setTimeout(()=>botMove(p.i),G.fast?0:SPEED[SETTINGS.speed]);
}
function rate(f){
  if(f>=0.5)return{lvl:'best',txt:'最佳',score:1};
  if(f>=0.2)return{lvl:'ok',txt:'可接受（混合策略）',score:0.75};
  if(f>=0.05)return{lvl:'meh',txt:'偏离',score:0.35};
  return{lvl:'bad',txt:'错误',score:0};
}
function userLabel(t,to){
  const p=P[0];const toCall=Math.min(G.currentBet-p.bet,p.stack),max=p.stack+p.bet;
  if(t==='fold')return'弃牌';if(t==='check')return'过牌';
  if(t==='call')return `跟注 ${fmt(toCall)}`;
  if(to>=max)return `全下 ${fmt(max)}`;
  return G.currentBet===0?`下注 ${fmt(to)}`:`加注到 ${fmt(to)}`;
}
function userAct(t,to){
  if(G.over||G.toAct!==0)return;
  const adv=G.cur,opt=adv.opts.find(o=>o.t===t),f=opt?opt.f:0,rating=rate(f);
  let note='';
  if((t==='bet'||t==='raise')&&opt&&opt.to&&f>0){const ratio=to/opt.to;if(ratio>1.8||ratio<0.55)note=`尺度偏离：建议约 ${fmt(opt.to)}bb。`;}
  const best=adv.opts.reduce((a,b)=>b.f>a.f?b:a);
  const chose=userLabel(t,to);
  const d={street:G.street,sit:adv.sit,chose,best:best.label,f,rating,note,board:G.board.slice()};
  G.decisions.push(d);G.feedback=d;G.lastAdvice=adv;G.showAdvice=true;
  commit(0,adv,t,to);
}
function defaultTo(){
  const p=P[0],max=p.stack+p.bet;const rec=G.cur&&G.cur.opts.find(o=>o.t==='raise'||o.t==='bet');
  const minTo=Math.min(G.currentBet+G.minRaise,max);
  return rec&&rec.to?rec.to:minTo;
}
function presets(){
  const p=P[0],max=p.stack+p.bet,minTo=Math.min(G.currentBet+G.minRaise,max),pot=potTotal(),cb=G.currentBet;
  const list=[];const rec=G.cur&&G.cur.opts.find(o=>o.t==='raise'||o.t==='bet');
  if(G.street===0){
    if(G.raiseLevel===0){const base=G.limpers.length*BB;[25+base,30+base,40+base].forEach(v=>list.push({to:v,label:`${fmt(v)}bb`}));}
    else[2.2,3,4].forEach(m=>{const v=round5(cb*m);list.push({to:v,label:`${m}x`});});
  }else if(cb===0)[0.33,0.5,0.75,1].forEach(fr=>list.push({to:round5(fr*pot),label:`${Math.round(fr*100)}%`}));
  else[2.5,3,4].forEach(m=>list.push({to:round5(cb*m),label:`${m}x`}));
  list.push({to:max,label:'全下'});
  const seen=new Set(),out=[];
  for(const x of list){const v=Math.min(Math.max(x.to,minTo),max);if(seen.has(v))continue;seen.add(v);out.push({to:v,label:x.label,rec:rec&&rec.to===v});}
  if(rec&&rec.to&&!seen.has(rec.to))out.unshift({to:rec.to,label:'建议',rec:true});
  return out;
}

/* ================= rendering ================= */
function render(){renderStats();renderTable();renderAction();renderAdvice();renderLog();}
function renderStats(){
  const acc=STATS.dec?Math.round(STATS.score/STATS.dec*100)+'%':'—';
  const net=STATS.net;
  $('#stats').innerHTML=`<div class="stat"><span>已打手数</span><b>${STATS.hands}</b></div>
  <div class="stat"><span>累计盈亏</span><b class="${net>0?'pos':net<0?'neg':''}">${net>0?'+':''}${fmt(net)}bb</b></div>
  <div class="stat"><span>决策得分</span><b>${acc}</b></div>`;
}
function renderTable(){
  const tb=$('#table');const W=tb.clientWidth||720,H=tb.clientHeight||470,small=W<560;
  const halfW=(small?39:54)+6,halfH=(small?42:46)+4,heroH=(small?50:56)+6;
  const rx=50-halfW/W*100,ry=50-halfH/H*100;
  const showAll=G.over&&G.result&&G.result.showdown;
  let h=`<div class="felt"></div><div class="center"><div class="street">${G.over?'本手结束':STREET_CN[G.street]}</div><div class="board">`;
  for(let i=0;i<5;i++)h+=G.board[i]!=null?cardHTML(G.board[i],'md'):'<span class="slot"></span>';
  h+=`</div><div class="potline">底池 <b>${fmt(potTotal())}</b> bb</div></div>`;
  for(const p of P){
    const a=(90+40*p.i)*Math.PI/180,c=Math.cos(a),s=Math.sin(a);
    const x=50+rx*c,y=p.i===0?100-heroH/H*100:50+ry*s;
    const cls=['seat'];if(p.isUser)cls.push('me');if(p.folded)cls.push('out');if(G.toAct===p.i&&!G.over)cls.push('turn');if(G.result&&G.result.won[p.i]>0)cls.push('win');
    let cards='';
    if(!p.folded){if(p.isUser||showAll)cards=p.hole.map(cc=>cardHTML(cc,p.isUser?'lg':'sm')).join('');else cards='<span class="card back sm"></span><span class="card back sm"></span>';}
    else if(p.isUser)cards=p.hole.map(cc=>cardHTML(cc,'lg')).join('');
    h+=`<div class="${cls.join(' ')}" style="left:${x}%;top:${y}%"><div class="hole">${cards}</div><div class="plate"><span class="nm">${p.name}</span><span class="ps">${POS_NAMES[p.pos]}</span></div><div class="stk">${fmt(p.stack)}${p.allIn&&!G.over?' · 全下':''}</div>${p.last?`<div class="tag t-${p.lastT||'x'}">${p.last}</div>`:''}</div>`;
    if(p.bet>0){const bx=50+rx*0.6*c,by=p.i===0?50+ry*0.56:50+ry*0.6*s;h+=`<div class="chip" style="left:${bx}%;top:${by}%">${fmt(p.bet)}</div>`;}
    if(p.i===G.button){const a2=a+0.33,dx=50+rx*0.74*Math.cos(a2),dy=50+ry*0.72*Math.sin(a2);h+=`<div class="dealer" style="left:${dx}%;top:${dy}%" title="庄家按钮">D</div>`;}
  }
  tb.innerHTML=h;
}
function renderAction(){
  const el=$('#actionbar'),p=P[0];
  if(G.over){
    const net=P[0].stack-START;
    el.innerHTML=`<div class="res">本手你${net>0?'<span class="pos">赢了</span>':net<0?'<span class="neg">输了</span>':'持平'} <b>${fmt(Math.abs(net))}</b> bb</div><div class="acts"><button class="btn primary" id="nextBtn">下一手</button></div>`;
    $('#nextBtn').onclick=newHand;return;
  }
  if(G.toAct!==0){
    const q=G.toAct>=0?P[G.toAct]:null;
    el.innerHTML=`<div class="wait">${q?`等待 ${who(q)} 行动…`:'发牌中…'}</div>${p.folded?'<div class="acts"><button class="btn ghost" id="ffBtn">快进到本手结束</button></div>':''}`;
    const ff=$('#ffBtn');if(ff)ff.onclick=()=>{G.fast=true;clearTimeout(G.timer);if(G.toAct>=0)botMove(G.toAct);else endStreet();};
    return;
  }
  const toCall=Math.min(G.currentBet-p.bet,p.stack),max=p.stack+p.bet,minTo=Math.min(G.currentBet+G.minRaise,max);
  const others=P.some(q=>q!==p&&!q.folded&&!q.allIn);
  const canRaise=p.stack>toCall&&others&&G.currentBet<max;
  const eff=Math.min(p.stack,Math.max(0,...P.filter(q=>q!==p&&!q.folded).map(q=>q.stack)));
  let h=`<div class="info"><span>轮到你 · ${posLabel(p.pos)}</span><span>底池 <b>${fmt(potTotal())}</b></span><span>需跟注 <b>${fmt(toCall)}</b></span><span>有效筹码 <b>${fmt(eff)}</b></span></div><div class="acts">`;
  if(toCall>0)h+=`<button class="btn fold" id="bFold">弃牌</button>`;
  h+=toCall>0?`<button class="btn call" id="bCall">${p.stack<=toCall?'跟注全下':'跟注'} ${fmt(toCall)}</button>`:`<button class="btn call" id="bCheck">过牌</button>`;
  if(canRaise)h+=`<button class="btn raise" id="bRaise"></button>`;
  h+='</div>';
  if(canRaise){
    h+='<div class="sizer">'+presets().map(x=>`<button class="pre${x.rec?' rec':''}${x.to===G.uiTo?' on':''}" data-to="${x.to}">${x.label}${x.rec&&x.label!=='建议'?' ·建议':''}</button>`).join('')+
      `<input type="range" id="sz" min="${minTo}" max="${max}" step="5" value="${G.uiTo}" aria-label="下注尺度"><input type="number" id="szn" min="${minTo/BB}" max="${max/BB}" step="0.5" value="${G.uiTo/BB}" aria-label="下注金额（bb）"></div>`;
  }
  el.innerHTML=h;
  const bf=$('#bFold');if(bf)bf.onclick=()=>userAct('fold');
  const bc=$('#bCall');if(bc)bc.onclick=()=>userAct('call');
  const bk=$('#bCheck');if(bk)bk.onclick=()=>userAct('check');
  if(canRaise){
    const br=$('#bRaise'),sz=$('#sz'),szn=$('#szn');
    const setTo=v=>{v=Math.min(Math.max(Math.round(v/5)*5,minTo),max);G.uiTo=v;sz.value=v;szn.value=v/BB;br.textContent=v>=max?`全下 ${fmt(max)}`:(G.currentBet===0?`下注 ${fmt(v)}`:`加注到 ${fmt(v)}`);el.querySelectorAll('.pre').forEach(b=>b.classList.toggle('on',+b.dataset.to===v));};
    setTo(G.uiTo||minTo);
    sz.oninput=()=>setTo(+sz.value);szn.onchange=()=>setTo(Math.round(+szn.value*BB));
    el.querySelectorAll('.pre').forEach(b=>b.onclick=()=>setTo(+b.dataset.to));
    br.onclick=()=>userAct(G.currentBet===0?'bet':'raise',G.uiTo);
  }
}
function fbHTML(d){
  if(!d)return'';
  return `<div class="fb lv-${d.rating.lvl}"><span class="badge">${d.rating.txt}</span>你选择了 <b>${d.chose}</b>，GTO 在这里选它的频率是 ${pc(d.f)}。${d.rating.lvl==='best'?'':`最高频的动作：${d.best}。`}${d.note?' '+d.note:''}</div>`;
}
function freqHTML(opts){
  const top=opts.reduce((a,b)=>b.f>a.f?b:a);
  return `<div class="fbar" role="img" aria-label="动作频率">${opts.filter(o=>o.f>0.001).map(o=>`<span class="f-${o.t}" style="width:${o.f*100}%"></span>`).join('')}</div>
  <ul class="opts">${opts.map(o=>`<li class="${o===top?'top':''}${o.f<0.005?' zero':''}"><i class="sw f-${o.t}"></i><span>${o.label}</span><b>${pc(o.f)}</b></li>`).join('')}</ul>`;
}
function matrixHTML(a){
  let h='<div class="mxwrap"><div class="mx">';
  for(let k=0;k<169;k++){
    const x=a.mat[k],r=x.raise*100,c=r+x.call*100;
    const bg=`linear-gradient(to right,var(--raise) 0 ${r}%,var(--call) ${r}% ${c}%,#2b3640 ${c}% 100%)`;
    h+=`<div class="${k===a.k?'hero':''}" style="background:${bg}">${clsName(k).replace(/[so]$/,'')}</div>`;
  }
  h+='</div></div><div class="legend"><span><i class="f-raise"></i>加注</span><span><i class="f-call"></i>'+(a.pre.m.check?'过牌':'跟注')+'</span><span><i style="background:#2b3640"></i>弃牌</span><span>右上同花 · 左下不同花 · 白框是你的手牌</span></div>';
  return h;
}
function adviceBody(a){
  let h=`<p class="sit">${a.sit}</p>`+freqHTML(a.opts);
  if(a.street===0){
    h+=`<div class="line"><span class="lbl">你的手牌</span> <b>${clsName(a.k)}</b> · <span class="lbl">加注范围</span> ${a.rp}%${a.cp>0?` · <span class="lbl">跟注范围</span> ${a.cp}%`:''}</div>`;
    h+=`<ul class="why">${a.reasons.map(r=>`<li>${r}</li>`).join('')}</ul>`;
    h+=matrixHTML(a);
  }else{
    h+=`<div class="grid4"><div class="kv"><span>胜率（对估计范围）</span><b>${pc(a.eq)}</b></div><div class="kv"><span>跟注所需胜率</span><b>${a.potOdds!=null?pc(a.potOdds):'—'}</b></div><div class="kv"><span>MDF</span><b>${a.mdf!=null?pc(a.mdf):'—'}</b></div><div class="kv"><span>SPR</span><b>${a.spr.toFixed(1)}</b></div></div>`;
    h+=`<div class="line"><span class="lbl">牌力</span> ${a.made} · ${a.cl.d}${a.cl.draw?` · <span class="lbl">听牌</span> ${a.cl.draw}`:''}</div><div class="line"><span class="lbl">牌面</span> ${a.tex.label}</div>`;
    if(a.dist){
      const order=BUCKET_UI;
      h+=`<div class="dist"><div class="line"><span class="lbl">${who(a.mainOpp)} 的估计范围构成</span></div><div class="bar">${order.map(([k])=>`<span class="b-${k}" style="width:${a.dist[k]*100}%"></span>`).join('')}</div><div class="legend">${order.map(([k,l])=>`<span><i class="b-${k}"></i>${l} ${pc(a.dist[k])}</span>`).join('')}</div></div>`;
    }
    h+=`<ul class="why">${a.reasons.map(r=>`<li>${r}</li>`).join('')}</ul>`;
  }
  return h;
}
function reviewHTML(){
  const r=G.result;let h=`<h2>本手复盘 <span class="kind">第 ${G.handNo} 手</span></h2>`;
  if(r&&r.showdown){
    h+='<div class="sd">'+P.filter(q=>!q.folded).sort((a,b)=>r.vals[b.i]-r.vals[a.i]).map(q=>`<div>${q.hole.map(c=>cardHTML(c,'xs')).join('')}<span class="${r.won[q.i]?'w':''}">${who(q)} · ${handName(r.vals[q.i])}${r.won[q.i]?` · 赢 ${fmt(r.won[q.i])}bb`:''}</span></div>`).join('')+'</div>';
  }else if(r){const w=P.find(q=>r.won[q.i]>0);h+=`<p class="empty">${who(w)} 下注后无人跟注，直接赢下底池。</p>`;}
  if(G.decisions.length){
    const sc=Math.round(G.decisions.reduce((a,d)=>a+d.rating.score,0)/G.decisions.length*100);
    h+=`<div class="line"><span class="lbl">本手决策得分</span> <b>${sc}%</b>（${G.decisions.length} 个决策）</div>`;
    h+='<div class="revwrap"><table class="rev"><thead><tr><th>街</th><th>你的选择</th><th>GTO 最高频</th><th>评价</th></tr></thead><tbody>'+
      G.decisions.map(d=>`<tr><td>${STREET_CN[d.street]}</td><td>${d.chose}</td><td>${d.best}</td><td><span class="rv lv-${d.rating.lvl}">${d.rating.txt}</span> ${pc(d.f)}${d.note?`<br><span class="lbl">${d.note}</span>`:''}</td></tr>`).join('')+'</tbody></table></div>';
  }else h+='<p class="empty">这手你没有需要做的决定（比如前面全弃牌到你的大盲）。</p>';
  return h;
}
function renderAdvice(){
  const el=$('#advice');
  if(G.over){el.innerHTML=reviewHTML()+(G.lastAdvice?`<div class="sep"></div><h2>你最后一步的分析 <span class="kind">${G.lastAdvice.street===0?'翻前 · 求解器范围近似':'翻后 · 启发式近似'}</span></h2>${fbHTML(G.feedback)}${adviceBody(G.lastAdvice)}`:'');return;}
  if(G.toAct===0&&G.cur){
    const kind=G.street===0?'翻前 · 求解器范围近似':'翻后 · 启发式近似';
    let h=`<h2>GTO 建议 <span class="kind">${kind}</span></h2>`;
    if(G.feedback&&G.feedback.street===G.street&&G.decisions.length)h+=`<div class="line"><span class="lbl">上一步</span></div>`+fbHTML(G.feedback);
    if(!G.showAdvice){h+=`<div class="quiz"><p class="sit">${G.cur.sit}</p><span>测验模式：先在下方做出你的决定，再看 GTO 怎么打。</span><button class="btn ghost" id="peek">现在就看建议</button></div>`;el.innerHTML=h;$('#peek').onclick=()=>{G.showAdvice=true;renderAdvice();};return;}
    el.innerHTML=h+adviceBody(G.cur);return;
  }
  if(G.lastAdvice){el.innerHTML=`<h2>上一步分析 <span class="kind">${G.lastAdvice.street===0?'翻前 · 求解器范围近似':'翻后 · 启发式近似'}</span></h2>${fbHTML(G.feedback)}${adviceBody(G.lastAdvice)}`;return;}
  el.innerHTML=`<h2>GTO 建议</h2><p class="empty">轮到你行动时，这里会显示 GTO 建议的动作和频率、范围矩阵、胜率和理由。</p>`;
}
function renderLog(){
  const el=$('#log');el.innerHTML=G.log.map(l=>`<li class="${l.cls}">${l.t}</li>`).join('');el.scrollTop=el.scrollHeight;
}

/* ================= boot ================= */
function initSettings(){
  const sp=$('#setPos'),sm=$('#setMode'),ss=$('#setSpeed');
  sp.value=SETTINGS.pos;sm.value=SETTINGS.mode;ss.value=SETTINGS.speed;
  sp.onchange=()=>{SETTINGS.pos=sp.value;save('gto9-settings',SETTINGS);};
  sm.onchange=()=>{SETTINGS.mode=sm.value;save('gto9-settings',SETTINGS);if(G.toAct===0&&!G.over){G.showAdvice=SETTINGS.mode==='live';renderAdvice();}};
  ss.onchange=()=>{SETTINGS.speed=ss.value;save('gto9-settings',SETTINGS);};
  let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{if(P.length)renderTable();},80);});
}
initSettings();
newHand();
</script>

<script>
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});}
</script>
